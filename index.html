<script>
// Конфигурация
const S_URL="https://ojxyjiawdprejvmbsvvj.supabase.co",S_KEY="sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks",
G_USER='evgensmoke',G_REPO='Mymusic',DEF_IMG=`https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;

// Состояние
let media={music:[],podcasts:[],photos:[],texts:[]},tab='home',cat='music',curId=null,search='',sb=null,tags=new Map;
const audio=document.getElementById('audio-engine');

try{sb=supabase.createClient(S_URL,S_KEY);}catch(e){}

// Инициализация
async function init(){
    try{
        let [m,p,ph,t]=await Promise.all([
            fetchList('music'),fetchList('podcasts'),
            fetchList('photos'),fetchList('texts')
        ]);
        media.music=createItems(m,'mp3');
        media.podcasts=createItems(p,'mp3');
        media.photos=createItems(ph,'img');
        media.texts=createItems(t,'txt');
        await loadTags();
        restore();
    }catch(e){console.warn(e)}finally{render()}
}

// Загрузка списка
async function fetchList(p){try{
    let r=await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/${p}`);
    return r.ok?await r.json():[];
}catch(e){return[]}}

// Создание элементов
function createItems(f,t){
    if(!f.length)return[];
    if(t=='mp3')return f.filter(f=>f.name?.endsWith('.mp3')).map(f=>{
        let id=f.name.replace('.mp3','');
        try{id=decodeURIComponent(id);}catch(e){}
        return{id,title:id,artist:'',url:f.download_url,img:DEF_IMG,likes:0,duration:'0:00',lyrics:'',loaded:0};
    });
    if(t=='img')return f.filter(f=>f.name?.match(/\.(jpg|png|webp)$/i)).map(f=>({url:f.download_url,title:f.name.replace(/\.[^/.]+$/,'')}));
    return f.filter(f=>f.name?.endsWith('.txt')).map(f=>({title:f.name.replace('.txt',''),url:f.download_url}));
}

// Загрузка тегов из БД
async function loadTags(){
    if(!sb)return;
    try{
        let {data}=await sb.from('likes').select('*');
        data?.forEach(i=>tags.set(i.song_id,{
            likes:+i.count||0,duration:i.duration||'0:00',
            artist:i.artist||'',img:i.cover_data||DEF_IMG,lyrics:i.lyrics||''
        }));
        [...media.music,...media.podcasts].forEach(i=>{
            let c=tags.get(i.id);
            if(c){i.likes=c.likes;i.duration=c.duration;i.artist=c.artist;i.img=c.img;i.lyrics=c.lyrics;i.loaded=1;}
        });
    }catch(e){}
}

// Восстановление плеера
function restore(){
    let id=localStorage.getItem('lastTrack'),time=localStorage.getItem('lastTime');
    let t=find(id);
    if(t){curId=id;audio.src=t.url;audio.currentTime=parseFloat(time)||0;updateUI(t);}
}

function find(id){return[...media.music,...media.podcasts].find(t=>t.id==id);}
function updateUI(t){if(!t)return;
    document.getElementById('now-playing').innerText=(t.artist?t.artist+' - ':'')+t.title;
    document.getElementById('bg-layer').style.backgroundImage=`url(${t.img})`;
}

// Рендер
function render(){
    let c=document.getElementById('main-content');
    document.getElementById('catalog-ui').style.display=tab=='catalog'?'block':'none';
    c.innerHTML='';
    
    let list=tab=='home'?media.music:tab=='my'?media.music.filter(t=>localStorage.getItem('fav_'+t.id)):media[cat]||[];
    if(search)list=list.filter(i=>(i.title||'').toLowerCase().includes(search.toLowerCase()));
    
    if(!list.length){c.innerHTML='<div style="text-align:center;padding:50px;color:#64748b;">Ничего не найдено</div>';return;}
    
    list.forEach(item=>{
        let el=document.createElement('div');
        el.className=`media-item ${curId==item.id?'active':''}`;
        
        if(tab=='catalog'&&cat=='photos'){
            el.innerHTML=`<img src="${item.url}" style="width:100%;border-radius:12px;cursor:pointer;" onclick="openPhoto('${item.url}')">`;
            c.appendChild(el);return;
        }
        if(tab=='catalog'&&cat=='texts'){
            el.onclick=()=>showText(item.url);
            el.innerHTML=`<div class="media-info"><div class="media-name">📄 ${item.title}</div></div>`;
            c.appendChild(el);return;
        }
        
        el.onclick=()=>play(item);
        let meta=item.loaded?`${item.artist?item.artist+' • ':''}${item.duration} • ${item.likes} ❤️`:'⏳ загрузка...';
        el.innerHTML=`
            <img src="${item.img}" class="media-img" onerror="this.src='${DEF_IMG}'">
            <div class="media-info">
                <div class="media-name">${item.title}</div>
                <div class="media-meta">${meta}</div>
            </div>
            <div class="item-btns">
                <span onclick="event.stopPropagation();toggleLike('${item.id}')">${localStorage.getItem('lk_'+item.id)?'❤️':'🤍'}</span>
                <span onclick="event.stopPropagation();toggleFav('${item.id}')">${localStorage.getItem('fav_'+item.id)?'⭐':'➕'}</span>
            </div>`;
        c.appendChild(el);
    });
}

// Воспроизведение
function play(t){
    if(!t)return;
    if(curId!=t.id){
        curId=t.id;audio.src=t.url;audio.play().catch(e=>{});
        updateUI(t);updateBtn(1);
        localStorage.setItem('lastTrack',t.id);
        if(!t.loaded)loadTagsFromFile(t);
    }else toggle();
    render();
}

// Чтение тегов из файла
function loadTagsFromFile(t){
    t.loading=1;render();
    jsmediatags.read(t.url,{
        onSuccess:(tag)=>{processTags(t,tag.tags);t.loading=0;},
        onError:(e)=>{t.loaded=1;t.loading=0;render();}
    });
}

// Обработка тегов
function processTags(t,tags){
    let changed=0;
    if(tags.artist){t.artist=tags.artist;changed=1;}
    if(tags.picture){
        try{
            let{data,format}=tags.picture,s='';
            for(let i=0;i<data.length;i++)s+=String.fromCharCode(data[i]);
            t.img=`data:${format};base64,${btoa(s)}`;changed=1;
            if(curId==t.id)document.getElementById('bg-layer').style.backgroundImage=`url(${t.img})`;
        }catch(e){}
    }
    if(tags.lyrics){t.lyrics=tags.lyrics;changed=1;}
    t.loaded=1;
    if(changed&&sb)saveTags(t);
    render();
}

// Сохранение в БД
async function saveTags(t){
    if(!sb)return;
    try{
        await sb.from('likes').upsert({
            song_id:t.id,count:t.likes||0,duration:t.duration||'0:00',
            artist:t.artist||'',cover_data:t.img||DEF_IMG,lyrics:t.lyrics||''
        },{onConflict:'song_id'});
        tags.set(t.id,{likes:t.likes,duration:t.duration,artist:t.artist,img:t.img,lyrics:t.lyrics});
    }catch(e){}
}

// Аудио события
audio.onloadedmetadata=()=>{
    let t=find(curId);
    if(t){
        let d=formatTime(audio.duration);
        if(t.duration!=d){t.duration=d;saveTags(t);render();}
    }
};
audio.ontimeupdate=()=>{
    if(audio.duration){
        document.getElementById('progress-fill').style.width=(audio.currentTime/audio.duration*100||0)+'%';
        document.getElementById('cur-time').innerText=formatTime(audio.currentTime);
        document.getElementById('dur-time').innerText=formatTime(audio.duration);
    }
};
audio.onended=()=>nextTrack();
audio.onplay=()=>updateBtn(1);
audio.onpause=()=>updateBtn(0);

// Навигация
function nextTrack(){
    let l=getList(),i=l.findIndex(x=>x.id==curId);
    if(i<l.length-1)play(l[i+1]);
}
function prevTrack(){
    let l=getList(),i=l.findIndex(x=>x.id==curId);
    if(i>0)play(l[i-1]);
}
function getList(){return tab=='home'?media.music:tab=='my'?media.music.filter(t=>localStorage.getItem('fav_'+t.id)):media[cat]||[];}

// Лайки
async function toggleLike(id){
    let t=find(id);if(!t)return;
    localStorage.getItem('lk_'+id)?(t.likes--,localStorage.removeItem('lk_'+id)):(t.likes++,localStorage.setItem('lk_'+id,'1'));
    render();saveTags(t);
}

// Избранное
function toggleFav(id){
    localStorage.getItem('fav_'+id)?localStorage.removeItem('fav_'+id):localStorage.setItem('fav_'+id,'1');
    render();
}

// UI функции
function toggle(){audio.paused?audio.play():audio.pause();}
function updateBtn(p){document.getElementById('p-icon').innerHTML=p?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5v14l11-7z"/>';}
function formatTime(s){if(!s||isNaN(s))return'0:00';let m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc;}
function seekByBar(e){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;}
function downloadTrack(){let t=find(curId);if(!t)return;let a=document.createElement('a');a.href=t.url;a.download=t.title+'.mp3';a.click();}
function handleSearch(){search=document.getElementById('search-input').value.toLowerCase();render();}
function setTab(t){tab=t;if(t=='catalog')setCat('music');render();document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.id=='tab-'+t));}
function setCat(c){cat=c;render();document.querySelectorAll('.cat-card').forEach(n=>n.classList.toggle('active',n.id=='btn-'+c));}

// Модалки
function openLyrics(){
    let t=find(curId);
    if(t?.lyrics){
        document.getElementById('text-content').innerHTML=`<pre style="white-space:pre-wrap">${t.lyrics}</pre>`;
        document.getElementById('text-modal').style.display='flex';
    }else msg('Текст не найден');
}
async function showText(u){
    try{
        let r=await fetch(u);
        document.getElementById('text-content').innerHTML=`<pre style="white-space:pre-wrap">${await r.text()}</pre>`;
        document.getElementById('text-modal').style.display='flex';
    }catch(e){err('Ошибка загрузки');}
}
function openPhoto(u){
    document.getElementById('text-content').innerHTML=`<img src="${u}" style="max-width:100%;max-height:70vh;border-radius:12px;">`;
    document.getElementById('text-modal').style.display='flex';
}

// Уведомления
function msg(m){
    let d=document.createElement('div');
    d.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,242,255,0.2);border:1px solid var(--neon);color:var(--neon);padding:8px 16px;border-radius:20px;z-index:1500;backdrop-filter:blur(10px);';
    d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);
}
function err(m){
    let d=document.createElement('div');
    d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ff4444;color:white;padding:10px 20px;border-radius:20px;z-index:3000;';
    d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}

// Сохранение состояния
window.addEventListener('beforeunload',()=>{if(curId){localStorage.setItem('lastTrack',curId);localStorage.setItem('lastTime',audio.currentTime);}});

// Запуск
document.addEventListener('DOMContentLoaded',init);
    </script>
