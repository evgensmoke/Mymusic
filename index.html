<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC - SUPABASE SYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #020617; color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 15px; min-height: 100vh; padding-bottom: 250px; 
            overflow-x: hidden;
        }

        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            filter: blur(60px) brightness(0.2); z-index: -1; transition: 1.5s; 
        }

        .main-title { 
            font-family: 'Orbitron', sans-serif; color: var(--neon); 
            text-align: center; font-size: 1.4rem; margin: 20px 0; 
            text-shadow: 0 0 15px rgba(0,242,255,0.4); 
        }

        .search-box { 
            width: 100%; max-width: 500px; margin: 0 auto 20px; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            border-radius: 20px; padding: 12px 20px; color: #fff; display: block; 
        }

        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

        .media-item { 
            display: flex; align-items: center; background: var(--glass); 
            border: 1px solid var(--border); border-radius: 14px; 
            padding: 10px; cursor: pointer; transition: 0.2s;
        }
        .media-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }

        .media-img { 
            width: 55px; height: 55px; border-radius: 10px; 
            object-fit: cover; margin-right: 15px; background: #000; flex-shrink: 0; 
        }

        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .media-meta { font-size: 0.75rem; color: #94a3b8; }

        .player-panel { 
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); 
            width: 94%; max-width: 500px; background: rgba(13, 18, 30, 0.95); 
            border: 1px solid var(--border); border-radius: 24px; 
            padding: 15px 20px; z-index: 1000; backdrop-filter: blur(20px); 
        }

        #now-playing { 
            color: var(--neon); text-align: center; font-size: 0.85rem; 
            font-weight: 600; margin-bottom: 12px; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .progress-area { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; margin-bottom: 15px; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; border-radius: 3px; box-shadow: 0 0 10px var(--neon); }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #fff; opacity: 0.8; }
        .play-btn { 
            width: 60px; height: 60px; background: var(--neon); 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; color: #000; font-size: 1.6rem; 
        }

        .nav-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; 
            background: #0a0f1c; border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; align-items: center; z-index: 1001; 
        }
        .nav-btn { color: #64748b; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .nav-btn.active { color: var(--neon); }

        #lyrics-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 2000; display: none; 
            padding: 30px 20px; align-items: center; justify-content: center; 
        }
        #lyrics-content { 
            background: #1e293b; padding: 25px; border-radius: 20px; 
            overflow-y: auto; max-height: 80vh; white-space: pre-wrap; 
            width: 100%; text-align: center; line-height: 1.7; font-size: 1.1rem;
            border: 1px solid var(--border);
        }

        .sync-trigger { position: fixed; top: 10px; right: 10px; font-size: 12px; color: var(--neon); background: none; border: 1px solid var(--neon); border-radius: 5px; padding: 2px 5px; opacity: 0.5; }
    </style>
</head>
<body>

<div id="bg-layer"></div>
<button class="sync-trigger" onclick="forceSync()">SYNC FILES</button>

<header>
    <div class="main-title">EVGEN MUSIC</div>
    <input type="text" class="search-box" placeholder="Поиск по названию..." id="search-input" oninput="render()">
</header>

<div id="main-content" class="content-grid">Подключение к базе...</div>

<div class="player-panel">
    <div id="now-playing" onclick="showLyrics()">ВЫБЕРИТЕ КОМПОЗИЦИЮ</div>
    <div class="progress-area" onclick="seek(event)"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <button class="ctrl-btn" onclick="showLyrics()">📝</button>
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <div class="play-btn" onclick="toggle()" id="p-icon">▶</div>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        <button class="ctrl-btn" onclick="location.reload()">🔄</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-btn active" onclick="setTab('home', this)">🏠<span>Главная</span></div>
    <div class="nav-btn" onclick="setTab('all', this)">📂<span>Все</span></div>
    <div class="nav-btn" onclick="setTab('fav', this)">⭐<span>Мои</span></div>
</nav>

<div id="lyrics-modal" onclick="this.style.display='none'"><div id="lyrics-content" onclick="event.stopPropagation()"></div></div>
<audio id="audio-engine" crossorigin="anonymous"></audio>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co", 
          S_KEY = "sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks";
    const G_USER = 'evgensmoke', 
          G_REPO = 'Mymusic', 
          DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;
    
    const sb = supabase.createClient(S_URL, S_KEY);
    const audio = document.getElementById('audio-engine');
    
    let songs = [];
    let curId = null;
    let currentTab = 'home';

    // --- 1. ЗАГРУЗКА ИЗ БАЗЫ ---
    async function init() {
        try {
            const { data, error } = await sb.from('likes').select('*');
            if (error) throw error;
            
            songs = data.map(r => ({
                id: r.song_id,
                url: `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/music/${encodeURIComponent(r.song_id)}.mp3`,
                img: (r.cover_data && r.cover_data.startsWith('data:')) ? r.cover_data : DEF_IMG,
                lyrics: r.lyrics || null,
                likes: r.count || 0,
                duration: r.duration || '--:--'
            }));
            
            console.log("✅ База данных загружена");
            render();
        } catch (e) {
            document.getElementById('main-content').innerHTML = `<div style="text-align:center; color:red">Ошибка сети. Проверь DNS в браузере!</div>`;
            console.error(e);
        }
    }

    // --- 2. ОТРИСОВКА СПИСКА ---
    function render() {
        const container = document.getElementById('main-content');
        const query = document.getElementById('search-input').value.toLowerCase();
        container.innerHTML = '';

        let filtered = songs;
        if (currentTab === 'home') filtered = songs.filter(s => s.likes > 0);
        if (currentTab === 'fav') filtered = songs.filter(s => localStorage.getItem('fav_' + s.id));

        filtered.filter(s => s.id.toLowerCase().includes(query)).forEach(s => {
            const el = document.createElement('div');
            el.className = `media-item ${curId === s.id ? 'active' : ''}`;
            el.onclick = () => play(s);
            el.innerHTML = `
                <img src="${s.img}" class="media-img" onerror="this.src='${DEF_IMG}'">
                <div class="media-info">
                    <div class="media-name">${s.id}</div>
                    <div class="media-meta">${s.duration} • Лайков: ${s.likes}</div>
                </div>
                <div onclick="event.stopPropagation(); toggleLike('${s.id}')" style="font-size:1.4rem; padding: 5px;">
                    ${s.likes > 0 ? '❤️' : '🤍'}
                </div>
            `;
            container.appendChild(el);
        });
    }

    // --- 3. ПРОИГРЫВАНИЕ И ОБРАБОТКА МЕТАДАННЫХ ---
    async function play(s) {
        if(curId !== s.id) {
            curId = s.id;
            audio.src = s.url;
            audio.play().catch(() => console.log("Ждем клика пользователя..."));
            
            document.getElementById('now-playing').innerText = s.id;
            document.getElementById('bg-layer').style.backgroundImage = `url(${s.img})`;
            document.getElementById('p-icon').innerText = '⏸';

            // Обновляем длительность при загрузке
            audio.onloadedmetadata = () => {
                const time = formatTime(audio.duration);
                if(s.duration !== time) {
                    s.duration = time;
                    updateDB(s.id, { duration: time });
                    render();
                }
            };

            // Если в базе пусто по картинке или тексту — тянем теги
            if (s.img === DEF_IMG || !s.lyrics) {
                fetchTagsFromMP3(s);
            }
        } else {
            toggle();
        }
        render();
    }

    // --- 4. ИЗВЛЕЧЕНИЕ ТЕГОВ (ГЛАВНЫЙ ФОКУС) ---
    function fetchTagsFromMP3(s) {
        // Используем corsproxy.io — он более стабильный для бинарных данных
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(s.url)}`;
        
        console.log("🔍 Пробую достать теги для:", s.id);

        new jsmediatags.Reader(proxyUrl).read({
            onSuccess: (tag) => {
                const t = tag.tags;
                let dataToUpdate = {};

                // 4.1 Извлекаем картинку
                if (t.picture && s.img === DEF_IMG) {
                    const bytes = new Uint8Array(t.picture.data);
                    let binary = "";
                    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                    const base64 = `data:${t.picture.format};base64,${window.btoa(binary)}`;
                    
                    // Проверка размера: Supabase Free Row Limit ~1-2MB. 
                    if (base64.length < 1000000) { 
                        s.img = base64;
                        dataToUpdate.cover_data = base64;
                        document.getElementById('bg-layer').style.backgroundImage = `url(${base64})`;
                        console.log("📸 Обложка успешно сконвертирована!");
                    } else {
                        console.warn("⚠️ Картинка слишком большая для базы данных");
                    }
                }

                // 4.2 Извлекаем текст
                if (t.lyrics && t.lyrics.lyrics && !s.lyrics) {
                    s.lyrics = t.lyrics.lyrics;
                    dataToUpdate.lyrics = s.lyrics;
                    console.log("📝 Текст успешно извлечен!");
                }

                // Сохраняем всё найденное в Supabase
                if (Object.keys(dataToUpdate).length > 0) {
                    updateDB(s.id, dataToUpdate).then(() => render());
                }
            },
            onError: (err) => {
                console.error("❌ Ошибка чтения тегов через прокси:", err.type, err.info);
            }
        });
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    async function updateDB(id, data) {
        return await sb.from('likes').upsert({ song_id: id, ...data }, { onConflict: 'song_id' });
    }

    async function toggleLike(id) {
        const s = songs.find(x => x.id === id);
        s.likes = s.likes > 0 ? 0 : 1;
        await updateDB(id, { count: s.likes });
        render();
    }

    function toggle() { 
        if(audio.paused) { audio.play(); document.getElementById('p-icon').innerText = '⏸'; }
        else { audio.pause(); document.getElementById('p-icon').innerText = '▶'; }
    }

    function showLyrics() {
        if(!curId) return;
        const s = songs.find(x => x.id === curId);
        document.getElementById('lyrics-content').innerText = s.lyrics || "Текст песни в тегах не обнаружен.";
        document.getElementById('lyrics-modal').style.display = 'flex';
    }

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }
    audio.ontimeupdate = () => { document.getElementById('progress-fill').style.width = (audio.currentTime/audio.duration*100) + '%'; };
    function formatTime(s) { let m=Math.floor(s/60),sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
    
    function setTab(t, el) { 
        currentTab = t; render(); 
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }
    
    async function forceSync() {
        const res = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/music`);
        const files = await res.json();
        for (let f of files) { 
            if(f.name.endsWith('.mp3')) {
                const name = f.name.replace('.mp3','');
                if(!songs.find(s => s.id === name)) await updateDB(name, { count: 0 });
            }
        }
        location.reload();
    }

    function nextTrack() { let i = songs.findIndex(x=>x.id===curId); if(i<songs.length-1) play(songs[i+1]); }
    function prevTrack() { let i = songs.findIndex(x=>x.id===curId); if(i>0) play(songs[i-1]); }

    // Поехали!
    init();
</script>
</body>
</html>
