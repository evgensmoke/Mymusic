<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC PRO+</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; min-height: 100vh; padding-bottom: 240px; overflow-x: hidden; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.15); z-index: -1; transition: 1.5s; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; font-size: 1.5rem; margin: 15px 0; text-shadow: 0 0 10px var(--neon); }
        .search-box { width: 100%; max-width: 500px; margin: 0 auto 15px; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 12px 20px; color: #fff; display: block; font-size: 16px; }
        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .media-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s; }
        .media-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .media-img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; margin-right: 12px; background: #000; flex-shrink: 0; }
        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-meta { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }
        .player-panel { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(13, 18, 30, 0.98); border: 1px solid var(--border); border-radius: 24px; padding: 15px; z-index: 1000; backdrop-filter: blur(20px); }
        #now-playing { color: var(--neon); text-align: center; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: glow 2s infinite alternate; }
        @keyframes glow { from { opacity: 0.8; } to { opacity: 1; text-shadow: 0 0 5px var(--neon); } }
        .progress-area { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 10px 0 5px; cursor: pointer; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; border-radius: 3px; box-shadow: 0 0 10px var(--neon); }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #94a3b8; }
        .play-btn { width: 55px; height: 55px; background: var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-size: 1.5rem; box-shadow: 0 0 15px rgba(0,242,255,0.3); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #0a0f1c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
        .nav-item { color: #64748b; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .nav-item.active { color: var(--neon); }
        #lyrics-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; display: none; padding: 25px; align-items: center; justify-content: center; }
        #lyrics-content { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-height: 75vh; overflow-y: auto; white-space: pre-wrap; text-align: center; line-height: 1.6; }
        .loader { text-align: center; padding: 20px; color: var(--neon); }
    </style>
</head>
<body>

<div id="bg-layer"></div>
<header>
    <div class="main-title">EVGEN MUSIC</div>
    <input type="text" class="search-box" placeholder="Найти шедевр..." id="search-input" oninput="render()">
</header>

<div id="main-content" class="content-grid">
    <div class="loader">Сдуваем пыль с пластинок...</div>
</div>

<div class="player-panel">
    <div id="now-playing" onclick="showLyrics()">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-area" onclick="seek(event)"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <button class="ctrl-btn" onclick="shareTrack()">🔗</button>
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <div class="play-btn" onclick="toggle()" id="p-icon">▶</div>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        <button class="ctrl-btn" onclick="location.reload()">🔄</button>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" id="tab-home" onclick="setTab('home')"><span>🏠</span><span>Главная</span></div>
    <div class="nav-item" id="tab-catalog" onclick="setTab('catalog')"><span>📂</span><span>Каталог</span></div>
    <div class="nav-item" id="tab-my" onclick="setTab('my')"><span>⭐</span><span>Избранное</span></div>
</nav>

<div id="lyrics-modal" onclick="this.style.display='none'"><div id="lyrics-content" onclick="event.stopPropagation()"></div></div>
<audio id="audio-engine"></audio>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co", S_KEY = "sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks";
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic', DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;
    
    const sb = supabase.createClient(S_URL, S_KEY);
    const audio = document.getElementById('audio-engine');
    let songs = [], curId = null, currentTab = 'home';

    // Декодер для борьбы с кривыми кодировками имен файлов
    function smartDecode(str) {
        try { return decodeURIComponent(str); } catch(e) {
            try { 
                const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
                return new TextDecoder('windows-1251').decode(bytes);
            } catch(e2) { return str; }
        }
    }

    async function init() {
        try {
            // 1. Сначала GitHub (сайт оживет сразу)
            const res = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/music`);
            const files = await res.json();
            
            songs = files.filter(f => f.name.endsWith('.mp3')).map(f => {
                const id = f.name.replace('.mp3', '');
                return {
                    id: id,
                    title: smartDecode(id),
                    artist: 'Загрузка...',
                    url: f.download_url,
                    img: DEF_IMG,
                    likes: 0,
                    lyrics: '',
                    duration: '--:--'
                };
            });
            render();

            // 2. Потом Supabase (тихо обновляем данные)
            const { data: dbData } = await sb.from('likes').select('*');
            if (dbData) {
                dbData.forEach(dbTrack => {
                    const s = songs.find(x => x.id === dbTrack.song_id);
                    if (s) {
                        s.likes = dbTrack.count || 0;
                        s.artist = dbTrack.artist || '';
                        s.duration = dbTrack.duration || '--:--';
                        if (dbTrack.cover_data) s.img = dbTrack.cover_data;
                        s.lyrics = dbTrack.lyrics || '';
                    }
                });
                render();
            }
        } catch (e) { console.error("Ошибка инициализации:", e); }
    }

    function render() {
        const container = document.getElementById('main-content');
        const query = document.getElementById('search-input').value.toLowerCase();
        container.innerHTML = '';

        let filtered = songs.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));

        if (currentTab === 'home') filtered = filtered.filter(s => s.likes > 0);
        if (currentTab === 'my') filtered = filtered.filter(s => localStorage.getItem('fav_' + s.id));

        if (filtered.length === 0) {
            container.innerHTML = `<div class="loader">${currentTab === 'home' ? 'Тут только лайкнутые треки. Лайкни что-нибудь!' : 'Ничего не нашли, ищи лучше.'}</div>`;
            return;
        }

        filtered.forEach(s => {
            const el = document.createElement('div');
            el.className = `media-item ${curId === s.id ? 'active' : ''}`;
            el.onclick = () => play(s);
            el.innerHTML = `
                <img src="${s.img}" class="media-img" onerror="this.src='${DEF_IMG}'">
                <div class="media-info">
                    <div class="media-name">${s.title}</div>
                    <div class="media-meta">${s.artist ? s.artist + ' • ' : ''}${s.duration}</div>
                </div>
                <div style="display:flex; gap:10px;">
                    <span onclick="event.stopPropagation(); toggleLike('${s.id}')">${s.likes > 0 ? '❤️' : '🤍'}</span>
                    <span onclick="event.stopPropagation(); toggleFav('${s.id}')">${localStorage.getItem('fav_'+s.id)?'⭐':'➕'}</span>
                </div>`;
            container.appendChild(el);
        });
    }

    async function play(s) {
        if (curId === s.id) { toggle(); return; }
        curId = s.id;
        audio.src = s.url;
        audio.play();

        document.getElementById('now-playing').innerText = (s.artist && s.artist !== 'Загрузка...') ? `${s.artist} - ${s.title}` : s.title;
        document.getElementById('bg-layer').style.backgroundImage = `url(${s.img})`;
        document.getElementById('p-icon').innerText = '⏸';
        
        // Магия извлечения тегов через Blob
        fetch(s.url).then(r => r.blob()).then(blob => {
            jsmediatags.read(blob, {
                onSuccess: (tag) => {
                    const t = tag.tags;
                    let needsUpdate = false;
                    
                    if (t.artist && s.artist !== t.artist) { s.artist = t.artist; needsUpdate = true; }
                    if (t.lyrics && t.lyrics.lyrics && !s.lyrics) { s.lyrics = t.lyrics.lyrics; needsUpdate = true; }
                    if (t.picture && s.img === DEF_IMG) {
                        const bytes = new Uint8Array(t.picture.data);
                        let binary = "";
                        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                        s.img = `data:${t.picture.format};base64,${window.btoa(binary)}`;
                        needsUpdate = true;
                    }

                    if (needsUpdate) {
                        updateDB(s.id, { artist: s.artist, cover_data: s.img, lyrics: s.lyrics });
                        render();
                        document.getElementById('now-playing').innerText = s.artist + " - " + s.title;
                        document.getElementById('bg-layer').style.backgroundImage = `url(${s.img})`;
                    }
                }
            });
        });
        render();
    }

    async function updateDB(id, data) {
        const s = songs.find(x => x.id === id);
        await sb.from('likes').upsert({ song_id: id, count: s.likes, ...data }, { onConflict: 'song_id' });
    }

    async function toggleLike(id) {
        const s = songs.find(x => x.id === id);
        s.likes = s.likes > 0 ? 0 : 1;
        render();
        await updateDB(id, { count: s.likes });
    }

    function toggleFav(id) {
        localStorage.getItem('fav_'+id) ? localStorage.removeItem('fav_'+id) : localStorage.setItem('fav_'+id, '1');
        render();
    }

    function shareTrack() {
        const s = songs.find(x => x.id === curId);
        if (!s) return alert("Сначала выбери трек, гений!");
        if (navigator.share) {
            navigator.share({ title: s.title, text: `Слушай ${s.title} на EVGEN MUSIC`, url: window.location.href });
        } else {
            prompt("Скопируй ссылку на плеер:", window.location.href);
        }
    }

    function showLyrics() {
        if (!curId) return;
        const s = songs.find(x => x.id === curId);
        document.getElementById('lyrics-content').innerText = s.lyrics || "Текст песни потерялся по дороге...";
        document.getElementById('lyrics-modal').style.display = 'flex';
    }

    function setTab(t) {
        currentTab = t;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.id === 'tab-'+t));
        render();
    }

    function toggle() { audio.paused ? audio.play() : audio.pause(); document.getElementById('p-icon').innerText = audio.paused ? '▶' : '⏸'; }
    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }
    function nextTrack() { let i = songs.findIndex(x => x.id === curId); if (i < songs.length - 1) play(songs[i+1]); }
    function prevTrack() { let i = songs.findIndex(x => x.id === curId); if (i > 0) play(songs[i-1]); }

    audio.ontimeupdate = () => { 
        document.getElementById('progress-fill').style.width = (audio.currentTime / audio.duration * 100) + '%'; 
    };
    audio.onended = () => nextTrack();

    init();
</script>
</body>
</html>
