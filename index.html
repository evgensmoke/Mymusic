<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVGEN MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.06); --border: rgba(255, 255, 255, 0.12); }
        body { 
            background: #020617; color: #fff; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh; padding-bottom: 240px;
        }
        header { text-align: center; margin-bottom: 25px; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); letter-spacing: 5px; font-size: 1.8rem; }

        .playlist { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .track-item { 
            display: flex; align-items: center; background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 18px; padding: 12px; cursor: pointer; transition: 0.2s;
        }
        .track-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.08); }
        .track-img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; margin-right: 15px; background: #000; }
        .track-info { flex-grow: 1; overflow: hidden; }
        .track-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .like-box { text-align: center; min-width: 45px; }
        .like-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: rgba(255,255,255,0.1); }
        .like-btn.active { color: #ff4d4d; }
        .like-count { font-size: 0.75rem; color: #94a3b8; display: block; }

        /* Ультимативный плеер */
        .player-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 95%; max-width: 480px; background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(35px); border-radius: 35px; padding: 15px 10px;
            border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 9999;
        }
        #now-playing { font-family: 'Orbitron'; font-size: 0.7rem; text-align: center; color: var(--neon); margin-bottom: 10px; padding: 0 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        .time-box { display: flex; justify-content: space-between; font-size: 0.7rem; color: #64748b; margin-bottom: 5px; padding: 0 15px; }
        .progress-bg { height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; margin: 0 15px 15px 15px; }
        #progress-bar { height: 100%; background: var(--neon); width: 0%; border-radius: 10px; box-shadow: 0 0 12px var(--neon); }

        /* Все кнопки в ряд по центру */
        .controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .c-btn { background: none; border: none; cursor: pointer; fill: #fff; padding: 8px; display: flex; transition: 0.2s; opacity: 0.6; }
        .c-btn:hover:not(.disabled) { opacity: 1; fill: var(--neon); transform: scale(1.1); }
        .c-btn.disabled { opacity: 0.05; cursor: default; }

        .play-btn { 
            background: var(--neon); border-radius: 50%; width: 55px; height: 55px; 
            fill: #000 !important; opacity: 1 !important; justify-content: center; align-items: center; 
            box-shadow: 0 0 20px rgba(0,242,255,0.3);
        }
    </style>
</head>
<body>

<header><div class="main-title">EVGEN MUSIC</div></header>
<div id="playlist" class="playlist"></div>

<div class="player-bar">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="time-box"><span id="cTime">0:00</span><span id="dTime">0:00</span></div>
    <div class="progress-bg" id="p-bg"><div id="progress-bar"></div></div>
    
    <div class="controls">
        <button id="btn-txt" class="c-btn disabled" onclick="openLyrics()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </button>

        <button class="c-btn" onclick="prev()"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        
        <button class="c-btn" onclick="skip(-10)"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>

        <button class="c-btn play-btn" onclick="toggle()">
            <svg width="26" height="26" viewBox="0 0 24 24"><path id="pIcon" d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="c-btn" onclick="skip(10)"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>

        <button class="c-btn" onclick="next()"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>

        <a id="btn-down" class="c-btn disabled" download href="#">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </a>
    </div>
</div>

<div id="lyrics-view" onclick="this.style.display='none'" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(15px); display:none; justify-content:center; align-items:center; z-index:100000;">
    <div style="background:var(--glass); padding:30px; border-radius:25px; border:1px solid var(--border); width:80%; max-height:60%; overflow-y:auto; white-space:pre-wrap; text-align:center; font-size:0.95rem; line-height:1.6;" id="lyrics-content" onclick="event.stopPropagation()"></div>
</div>

<audio id="player"></audio>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co";
    const S_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qeHlqaWF3ZHByZWp2bWJzdnZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDE4NjcsImV4cCI6MjA4NTY3Nzg2N30.ZnmxdnR_x0C61C7ZOSWi-Xlgg2gUGmNmz7jBHHGZ9EU".trim();
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic';
    const DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;

    let tracks = [], cur = -1, spb = supabase.createClient(S_URL, S_KEY);
    const audio = document.getElementById('player');

    async function init() {
        try {
            const res = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/`);
            const files = await res.json();
            const mp3s = files.filter(f => f.name.toLowerCase().endsWith('.mp3'));

            tracks = mp3s.map(f => {
                const name = f.name.replace(/\.[^/.]+$/, "");
                const img = files.find(file => file.name.startsWith(name) && /\.(jpg|jpeg|png|webp)$/i.test(file.name));
                const txt = files.find(file => file.name.toLowerCase() === (name + '.txt').toLowerCase());
                return {
                    id: name,
                    title: decodeURIComponent(name).replace(/_/g, " "),
                    url: f.download_url,
                    img: img ? img.download_url : DEF_IMG,
                    txt: txt ? txt.download_url : null
                };
            });
            render();
            loadLikes();
        } catch(e) { console.error("Error loading tracks"); }
    }

    function render() {
        document.getElementById('playlist').innerHTML = tracks.map((t, i) => `
            <div class="track-item" id="item-${i}" onclick="playT(${i})">
                <img src="${t.img}" onerror="this.src='${DEF_IMG}'" class="track-img">
                <div class="track-info"><div class="track-name">${t.title}</div></div>
                <div class="like-box">
                    <button class="like-btn" id="l-${i}" onclick="event.stopPropagation(); vote('${t.id}', ${i})">❤️</button>
                    <span class="like-count" id="c-${i}">0</span>
                </div>
            </div>`).join('');
    }

    function playT(i) {
        if (cur !== -1) document.getElementById(`item-${cur}`).classList.remove('active');
        cur = i;
        const t = tracks[i];
        document.getElementById(`item-${cur}`).classList.add('active');
        audio.src = t.url;
        audio.play();
        
        document.getElementById('now-playing').innerText = t.title;
        document.getElementById('pIcon').setAttribute('d', "M6 19h4V5H6v14zm8-14v14h4V5h-4z");
        
        document.getElementById('btn-down').href = t.url;
        document.getElementById('btn-down').classList.remove('disabled');
        const tb = document.getElementById('btn-txt');
        if (t.txt) tb.classList.remove('disabled'); else tb.classList.add('disabled');
    }

    async function openLyrics() {
        if (cur === -1 || !tracks[cur].txt) return;
        const res = await fetch(tracks[cur].txt);
        const text = await res.text();
        document.getElementById('lyrics-content').innerText = text;
        document.getElementById('lyrics-view').style.display = 'flex';
    }

    function toggle() {
        if (cur === -1) return playT(0);
        if (audio.paused) { audio.play(); document.getElementById('pIcon').setAttribute('d', "M6 19h4V5H6v14zm8-14v14h4V5h-4z"); }
        else { audio.pause(); document.getElementById('pIcon').setAttribute('d', "M8 5v14l11-7z"); }
    }

    function skip(s) { audio.currentTime += s; }

    function fmt(s) {
        if (isNaN(s)) return "0:00";
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('progress-bar').style.width = p + '%';
        document.getElementById('cTime').innerText = fmt(audio.currentTime);
        document.getElementById('dTime').innerText = fmt(audio.duration);
    };

    document.getElementById('p-bg').onclick = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    };

    function next() { playT((cur + 1) % tracks.length); }
    function prev() { playT((cur - 1 + tracks.length) % tracks.length); }

    async function loadLikes() {
        const { data } = await spb.from('likes').select('*');
        data?.forEach(r => {
            const i = tracks.findIndex(t => t.id === r.song_id);
            if (i !== -1) {
                document.getElementById(`c-${i}`).innerText = r.count || 0;
                if (r.count > 0) document.getElementById(`l-${i}`).classList.add('active');
            }
        });
    }

    async function vote(id, i) {
        const btn = document.getElementById(`l-${i}`);
        const cnt = document.getElementById(`c-${i}`);
        let n = parseInt(cnt.innerText);
        btn.classList.toggle('active');
        n = btn.classList.contains('active') ? n + 1 : Math.max(0, n - 1);
        cnt.innerText = n;
        await spb.from('likes').upsert({ song_id: id, count: n }, { onConflict: 'song_id' });
    }

    init();
</script>
</body>
</html>
