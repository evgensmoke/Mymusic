<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC FIXED</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; outline: none; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; padding-bottom: 240px; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.15); z-index: -1; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; font-size: 1.5rem; margin: 15px 0; text-shadow: 0 0 10px var(--neon); }
        #status-bar { text-align: center; font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; }
        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .media-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; }
        .media-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .media-img { width: 50px; height: 50px; border-radius: 8px; margin-right: 12px; background: #000; }
        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-panel { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(13, 18, 30, 0.95); border: 1px solid var(--border); border-radius: 24px; padding: 15px; backdrop-filter: blur(20px); }
        #now-playing { color: var(--neon); text-align: center; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; }
        .progress-area { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; border-radius: 3px; }
        .controls-row { display: flex; justify-content: space-around; align-items: center; margin-top: 15px; }
        .play-btn { width: 50px; height: 50px; background: var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; fill: #000; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #0a0f1c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #64748b; font-size: 0.7rem; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--neon); }
    </style>
</head>
<body>

<div id="bg-layer"></div>
<div class="main-title">EVGEN MUSIC</div>
<div id="status-bar">Подключение к GitHub...</div>

<div id="main-content" class="content-grid"></div>

<div class="player-panel">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-area" onclick="seek(event)"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <button style="background:none; border:none; color:#fff;" onclick="prev()">⏮</button>
        <div class="play-btn" onclick="toggle()"><svg id="p-icon" viewBox="0 0 24 24" width="24"><path d="M8 5v14l11-7z"/></svg></div>
        <button style="background:none; border:none; color:#fff;" onclick="next()">⏭</button>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()">🔄<span>Обновить</span></div>
    <div class="nav-item">📁<span>Музыка</span></div>
</nav>

<audio id="audio"></audio>

<script>
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic';
    const audio = document.getElementById('audio');
    let tracks = [];
    let curIdx = -1;

    async function init() {
        const status = document.getElementById('status-bar');
        try {
            // Прямой запрос к API GitHub
            const resp = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/music`);
            if (!resp.ok) throw new Error(`Ошибка GitHub: ${resp.status}`);
            
            const files = await resp.json();
            tracks = files.filter(f => f.name.endsWith('.mp3')).map(f => ({
                name: decodeURIComponent(f.name.replace('.mp3', '')),
                url: f.download_url,
                id: f.name
            }));

            status.innerText = `Загружено треков: ${tracks.length}`;
            render();
        } catch (e) {
            status.innerText = "Ошибка загрузки. Проверь VPN или лимиты GitHub.";
            console.error(e);
        }
    }

    function render() {
        const container = document.getElementById('main-content');
        container.innerHTML = tracks.map((t, i) => `
            <div class="media-item ${curIdx === i ? 'active' : ''}" onclick="playTrack(${i})">
                <div class="media-img"></div>
                <div class="media-info">
                    <div class="media-name">${t.name}</div>
                </div>
            </div>
        `).join('');
    }

    function playTrack(i) {
        curIdx = i;
        const t = tracks[i];
        audio.src = t.url;
        audio.play();
        document.getElementById('now-playing').innerText = t.name;
        updateBtn(true);
        render();
    }

    function toggle() {
        if (audio.paused) { audio.play(); updateBtn(true); }
        else { audio.pause(); updateBtn(false); }
    }

    function updateBtn(playing) {
        document.getElementById('p-icon').innerHTML = playing 
            ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
            : '<path d="M8 5v14l11-7z"/>';
    }

    function next() { if (curIdx < tracks.length - 1) playTrack(curIdx + 1); }
    function prev() { if (curIdx > 0) playTrack(curIdx - 1); }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('progress-fill').style.width = p + '%';
    };

    function seek(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const p = (e.clientX - rect.left) / rect.width;
        audio.currentTime = p * audio.duration;
    }

    init();
</script>
</body>
</html>
