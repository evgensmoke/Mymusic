<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); --fav: #fbbf24; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; min-height: 100vh; padding-bottom: 240px; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.2); z-index: -1; transition: 1.5s; }
        header { margin-bottom: 20px; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; letter-spacing: 3px; font-size: 1.6rem; margin-bottom: 15px; text-shadow: 0 0 15px rgba(0,242,255,0.4); }
        .search-box { width: 100%; max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 25px; padding: 12px 20px; color: #fff; display: block; font-size: 16px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto 20px; }
        .cat-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; font-weight: 600; color: #94a3b8; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s; }
        .cat-card.active { border-color: var(--neon); color: var(--neon); background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 15px rgba(0,242,255,0.1); }
        .cat-card svg { width: 28px; height: 28px; fill: currentColor; }
        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .media-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
        .media-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.05); }
        .media-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 14px; background: #000; flex-shrink: 0; }
        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-meta { font-size: 0.75rem; color: #94a3b8; }
        .player-panel { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 500px; background: rgba(13, 18, 30, 0.95); border: 1px solid var(--border); border-radius: 24px; padding: 15px 20px; z-index: 1000; backdrop-filter: blur(20px); box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        #now-playing { color: var(--neon); text-align: center; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-area { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; margin-bottom: 15px; position: relative; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; border-radius: 2px; position: relative; transition: width 0.1s linear; }
        #progress-fill::after { content: ''; position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px var(--neon); }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: none; border: none; fill: #94a3b8; cursor: pointer; padding: 8px; }
        .play-btn { width: 60px; height: 60px; background: var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; fill: #000; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #0a0f1c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
        .nav-item { color: #64748b; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 33%; }
        .nav-item.active { color: var(--neon); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        #text-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; padding: 30px; flex-direction: column; justify-content: center; }
        #text-content { background: #1e293b; padding: 25px; border-radius: 20px; overflow-y: auto; max-height: 80vh; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5; border: 1px solid var(--border); }
    </style>
</head>
<body>
<div id="bg-layer"></div>
<header>
    <div class="main-title">EVGEN MUSIC</div>
    <input type="text" class="search-box" placeholder="Поиск музыки..." id="search-input" oninput="render()">
</header>
<div id="catalog-ui" style="display:none;">
    <div class="category-grid">
        <div class="cat-card active" id="btn-music" onclick="setCategory('music')"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>Музыка</div>
        <div class="cat-card" id="btn-podcasts" onclick="setCategory('podcasts')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>Подкасты</div>
        <div class="cat-card" id="btn-photos" onclick="setCategory('photos')"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Фото</div>
        <div class="cat-card" id="btn-texts" onclick="setCategory('texts')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Тексты</div>
    </div>
</div>
<div id="main-content" class="content-grid">Загрузка...</div>
<div class="player-panel">
    <div id="now-playing" onclick="openLyrics()">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-area" id="p-bg" onclick="seekAbs(event)"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <button class="ctrl-btn" onclick="openLyrics()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2z"/></svg></button>
        <button class="ctrl-btn" onclick="audio.currentTime-=10"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
        <button class="ctrl-btn" onclick="prevTrack()"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <div class="play-btn" onclick="toggle()"><svg id="p-icon" width="32" height="32" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <button class="ctrl-btn" onclick="nextTrack()"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button class="ctrl-btn" onclick="audio.currentTime+=10"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
        <button class="ctrl-btn" onclick="downloadTrack()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
    </div>
</div>
<nav class="bottom-nav">
    <div class="nav-item active" id="tab-home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Главная</span></div>
    <div class="nav-item" id="tab-catalog" onclick="setTab('catalog')"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg><span>Каталог</span></div>
    <div class="nav-item" id="tab-my" onclick="setTab('my')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Моё</span></div>
</nav>
<div id="text-modal" onclick="this.style.display='none'"><div id="text-content" onclick="event.stopPropagation()"></div></div>
<audio id="audio-engine" crossorigin="anonymous"></audio>
<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co", S_KEY = "sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks";
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic', DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;
    
    let media = { music: [], podcasts: [], photos: [], texts: [] };
    let currentTab = 'home', currentCategory = 'music', curId = null;
    const audio = document.getElementById('audio-engine'), sb = supabase.createClient(S_URL, S_KEY);

    async function init() {
        const cached = sessionStorage.getItem('music_cache');
        if (cached) { media = JSON.parse(cached); render(); await syncDB(); }
        else { await loadFromGitHub(); }
    }

    async function loadFromGitHub() {
        try {
            const [m, p, i, t] = await Promise.all([fGH('music'), fGH('podcasts'), fGH('photos'), fGH('texts')]);
            const mapMP3 = (fs) => (fs || []).filter(f => f.name.endsWith('.mp3')).map(f => ({
                id: f.name.replace('.mp3',''), title: decodeURIComponent(f.name.replace('.mp3','')),
                url: f.download_url, img: DEF_IMG, likes: 0, duration: '--:--', artist: ''
            }));
            media.music = mapMP3(m); media.podcasts = mapMP3(p);
            media.photos = (i || []).filter(f => /\.(jpg|png|webp)$/i.test(f.name)).map(f => f.download_url);
            media.texts = (t || []).filter(f => f.name.endsWith('.txt')).map(f => ({ n: f.name.replace('.txt',''), u: f.download_url }));
            sessionStorage.setItem('music_cache', JSON.stringify(media));
            render(); await syncDB();
        } catch(e) { document.getElementById('main-content').innerText = "GitHub Limit 403. Подожди 5 мин."; }
    }

    async function fGH(path) { 
        const r = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/${path}`);
        return await r.json();
    }

    async function syncDB() {
        const { data } = await sb.from('likes').select('*');
        if (data) data.forEach(r => {
            const track = [...media.music, ...media.podcasts].find(x => x.id === r.song_id);
            if (track) { track.likes = r.count || 0; track.duration = r.duration || '--:--'; if (r.cover_data) track.img = r.cover_data; if (r.artist) track.artist = r.artist; }
        });
        render();
    }

    function render() {
        const container = document.getElementById('main-content'), search = (document.getElementById('search-input').value || "").toLowerCase();
        document.getElementById('catalog-ui').style.display = (currentTab === 'catalog') ? 'block' : 'none';
        container.innerHTML = '';
        let list = (currentTab === 'home') ? media.music.filter(x => x.likes > 0) : (currentTab === 'my' ? media.music.filter(x => localStorage.getItem('fav_'+x.id)) : media[currentCategory]);

        list.forEach(item => {
            const name = item.title || item.n || "";
            if (search && !name.toLowerCase().includes(search)) return;
            const el = document.createElement('div'); el.className = `media-item ${curId === item.id ? 'active' : ''}`;
            if (currentCategory === 'photos' && currentTab === 'catalog') { el.innerHTML = `<img src="${item}" style="width:100%; border-radius:12px;">`; }
            else if (currentCategory === 'texts' && currentTab === 'catalog') { el.onclick = () => showText(item.u); el.innerHTML = `<div class="media-info"><div class="media-name">📄 ${item.n}</div></div>`; }
            else {
                el.onclick = () => play(item);
                el.innerHTML = `<img src="${item.img}" class="media-img"><div class="media-info"><div class="media-name">${item.title}</div><div class="media-meta">${item.artist || 'Evgen'} • ${item.duration} • ${item.likes} ❤️</div></div><div style="display:flex; gap:12px; font-size:1.1rem;"><span onclick="event.stopPropagation(); toggleLike('${item.id}')">${item.likes > 0 ? '❤️' : '🤍'}</span><span onclick="event.stopPropagation(); toggleFav('${item.id}')">${localStorage.getItem('fav_'+item.id)?'⭐':'➕'}</span></div>`;
            }
            container.appendChild(el);
        });
    }

    async function play(t) {
        if(curId !== t.id) {
            curId = t.id; audio.src = t.url; audio.play();
            document.getElementById('now-playing').innerText = t.title;
            document.getElementById('bg-layer').style.backgroundImage = `url(${t.img})`;
            setTimeout(() => processMetadata(t), 500);
        } else toggle(); render();
    }

    async function processMetadata(t) {
        let updateData = { song_id: t.id }; let needsUpdate = false;
        if (t.duration === '--:--' && audio.duration) { t.duration = formatTime(audio.duration); updateData.duration = t.duration; needsUpdate = true; }
        if (t.img === DEF_IMG) {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(t.url)}`;
            new jsmediatags.Reader(proxyUrl).read({
                onSuccess: async (tag) => {
                    if (tag.tags.picture) {
                        const { data, format } = tag.tags.picture; let base64 = "";
                        for (let i = 0; i < data.length; i++) base64 += String.fromCharCode(data[i]);
                        t.img = `data:${format};base64,${window.btoa(base64)}`; updateData.cover_data = t.img;
                        if (tag.tags.artist) { t.artist = tag.tags.artist; updateData.artist = t.artist; }
                        await sb.from('likes').upsert(updateData, { onConflict: 'song_id' }); render();
                        document.getElementById('bg-layer').style.backgroundImage = `url(${t.img})`;
                    }
                }
            });
        } else if (needsUpdate) { await sb.from('likes').upsert(updateData, { onConflict: 'song_id' }); render(); }
    }

    function toggle() { audio.paused ? audio.play() : audio.pause(); updateBtn(); }
    function updateBtn() { document.getElementById('p-icon').innerHTML = audio.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
    audio.ontimeupdate = () => { document.getElementById('progress-fill').style.width = (audio.currentTime/audio.duration*100) + '%'; };
    function seekAbs(e) { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }
    async function toggleLike(id) { const t = [...media.music, ...media.podcasts].find(x => x.id === id); t.likes = t.likes > 0 ? 0 : 1; render(); await sb.from('likes').upsert({ song_id: id, count: t.likes }, { onConflict: 'song_id' }); }
    function toggleFav(id) { localStorage.getItem('fav_'+id) ? localStorage.removeItem('fav_'+id) : localStorage.setItem('fav_'+id, '1'); render(); }
    async function showText(url) { try { const r = await fetch(url); const buf = await r.arrayBuffer(); let txt = new TextDecoder("utf-8").decode(buf); document.getElementById('text-content').innerText = txt; document.getElementById('text-modal').style.display = 'flex'; } catch(e) { alert("Ошибка текста"); } }
    function openLyrics() { const t = [...media.music, ...media.podcasts].find(x => x.id === curId); if(!t) return; const txtFile = media.texts.find(x => x.n === t.id); if(txtFile) showText(txtFile.u); else alert("Добавь .txt в папку texts"); }
    function downloadTrack() { const t = [...media.music, ...media.podcasts].find(x => x.id === curId); if(t) { const a = document.createElement('a'); a.href = t.url; a.download = t.title; a.click(); } }
    function formatTime(s) { let m = Math.floor(s / 60), sec = Math.floor(s % 60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
    function setTab(t) { currentTab = t; render(); document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.id === 'tab-'+t)); }
    function setCategory(c) { currentCategory = c; render(); document.querySelectorAll('.cat-card').forEach(n => n.classList.toggle('active', n.id === 'btn-'+c)); }
    function nextTrack() { let l = getL(); let i = l.findIndex(x => x.id === curId); if(i < l.length-1) play(l[i+1]); }
    function prevTrack() { let l = getL(); let i = l.findIndex(x => x.id === curId); if(i > 0) play(l[i-1]); }
    function getL() { return (currentTab === 'catalog') ? media[currentCategory] : media.music; }
    init();
</script>
</body>
</html>
