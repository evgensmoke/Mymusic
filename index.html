<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --neon: #00f2ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; padding-bottom: 220px; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        /* Заголовок */
        header { text-align: center; padding: 30px 0; }
        .main-title { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }

        /* Список треков */
        .playlist { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .track-item { display: flex; align-items: center; background: var(--card); border-radius: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .track-item.active { border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        .track-img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; margin-right: 15px; background: #222; flex-shrink: 0; }
        .track-info { flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
        .track-name { font-weight: 600; font-size: 1rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        
        /* Лайки */
        .like-box { text-align: center; min-width: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .like-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #30363d; transition: 0.2s; padding: 0; line-height: 1; }
        .like-btn.active { color: #f85149; transform: scale(1.15); drop-shadow: 0 0 10px rgba(248, 81, 73, 0.4); }
        .like-count { font-size: 0.75rem; color: #8b949e; margin-top: 5px; font-weight: bold; }

        /* ПЛЕЕР БАР */
        .player-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 480px; background: #12161c; border-radius: 35px; padding: 20px 25px; border: 1px solid rgba(255,255,255,0.08); z-index: 9999; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        /* Инфо о треке в плеере */
        .player-info { text-align: center; margin-bottom: 15px; }
        #now-playing { font-family: 'Orbitron', sans-serif; color: var(--neon); font-size: 0.9rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Прогресс бар и время */
        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: #8b949e; margin-bottom: 15px; }
        .progress-bg { flex-grow: 1; height: 4px; background: #30363d; border-radius: 2px; cursor: pointer; position: relative; }
        #progress-bar { width: 0%; height: 100%; background: var(--neon); border-radius: 2px; box-shadow: 0 0 10px var(--neon); position: relative; }
        /* Точка на конце прогресса */
        #progress-bar::after { content: ''; position: absolute; right: -4px; top: -3px; width: 10px; height: 10px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px var(--neon); opacity: 0; transition: opacity 0.2s; }
        .progress-bg:hover #progress-bar::after { opacity: 1; }

        /* Кнопки управления */
        .controls { display: flex; align-items: center; justify-content: space-between; }
        .c-btn { background: none; border: none; cursor: pointer; fill: #fff; padding: 8px; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.8; }
        .c-btn:active { transform: scale(0.9); }
        .c-btn:hover { opacity: 1; fill: var(--neon); }
        
        /* Главная кнопка Play */
        .play-btn { width: 60px; height: 60px; background: var(--neon); border-radius: 50%; fill: #000 !important; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); opacity: 1; margin: 0 10px; }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 242, 255, 0.6); }
        
        .dl-btn { fill: #8b949e; margin-left: auto; } /* Скачивание чуть правее или отдельно */
    </style>
</head>
<body>

<header>
    <div class="main-title">MY MUSIC<br>COLLECTION</div>
</header>

<div id="playlist" class="playlist">Загрузка треков...</div>

<div class="player-bar">
    <div class="player-info">
        <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    </div>

    <div class="progress-container">
        <span id="cur-time">0:00</span>
        <div class="progress-bg" id="p-bg"><div id="progress-bar"></div></div>
        <span id="dur-time">0:00</span>
    </div>

    <div class="controls">
        <button class="c-btn" onclick="prev()">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg>
        </button>
        
        <button class="c-btn" onclick="skip(-10)">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>

        <button class="c-btn play-btn" onclick="toggle()">
            <svg width="32" height="32" viewBox="0 0 24 24">
                <path id="pIcon" d="M8 5v14l11-7z"/>
            </svg>
        </button>

        <button class="c-btn" onclick="skip(10)">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </button>

        <button class="c-btn" onclick="next()">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>

        <button class="c-btn dl-btn" id="main-dl" title="Скачать">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM12 2L7 7h3v6h4V7h3l-5-5z"/></svg>
        </button>
    </div>
</div>

<audio id="player"></audio>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co";
    const S_KEY = "Sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks"; 
    // Настройки GitHub
    const CFG = { 
        user: 'evgensmoke', 
        repo: 'Mymusic', 
        defImg: 'https://raw.githubusercontent.com/evgensmoke/Mymusic/main/default.jpg' 
    };

    let tracks = [], cur = -1, spb;
    const audio = document.getElementById('player');
    const pIcon = document.getElementById('pIcon');
    const ICONS = {
        play: "M8 5v14l11-7z",
        pause: "M6 19h4V5H6v14zm8-14v14h4V5h-4z"
    };

    async function init() {
        if (window.supabase) spb = window.supabase.createClient(S_URL, S_KEY);

        try {
            const res = await fetch(`https://api.github.com/repos/${CFG.user}/${CFG.repo}/contents/`);
            if (!res.ok) throw new Error("GitHub API Error");
            const data = await res.json();
            
            tracks = data
                .filter(f => f.name.toLowerCase().endsWith('.mp3'))
                .map(f => {
                    // Чистим имя файла для названия
                    const rawName = f.name.replace(/\.[^/.]+$/, ""); 
                    const cleanName = decodeURIComponent(rawName).replace(/_/g, " ");
                    
                    return {
                        id: rawName, // ID для базы лайков
                        title: cleanName,
                        url: f.download_url,
                        // Пытаемся найти картинку с тем же именем (jpg)
                        img: f.download_url.replace('.mp3', '.jpg'),
                        fallback: CFG.defImg
                    };
                });
            
            render();
            if (spb) loadLikes();
            
        } catch(e) { 
            console.error(e);
            document.getElementById('playlist').innerHTML = `<div style="text-align:center;color:red">Ошибка загрузки: ${e.message}</div>`; 
        }
    }

    function render() {
        document.getElementById('playlist').innerHTML = tracks.map((t, i) => `
            <div class="track-item" id="item-${i}" onclick="playT(${i})">
                <img src="${t.img}" onerror="this.onerror=null;this.src='${t.fallback}';" class="track-img">
                <div class="track-info">
                    <div class="track-name">${t.title}</div>
                </div>
                <div class="like-box">
                    <button class="like-btn" id="l-${i}" onclick="event.stopPropagation(); vote('${t.id}', ${i})">❤️</button>
                    <span class="like-count" id="c-${i}">0</span>
                </div>
            </div>
        `).join('');
    }

    async function loadLikes() {
        const { data } = await spb.from('likes').select('*');
        if (data) {
            data.forEach(row => {
                const idx = tracks.findIndex(t => t.id === row.song_id);
                if (idx !== -1) document.getElementById(`c-${idx}`).innerText = row.count;
            });
        }
    }

    async function vote(songId, idx) {
        if (!spb) return;
        const countEl = document.getElementById(`c-${idx}`);
        const btn = document.getElementById(`l-${idx}`);
        let count = parseInt(countEl.innerText) || 0;

        btn.classList.toggle('active');
        const isAdding = btn.classList.contains('active');
        const newCount = isAdding ? count + 1 : Math.max(0, count - 1);
        
        // Моментальное обновление на экране
        countEl.innerText = newCount;

        // Отправка в базу
        await spb.from('likes').upsert({ song_id: songId, count: newCount }, { onConflict: 'song_id' });
    }

    function playT(i) {
        if (cur !== -1) document.getElementById(`item-${cur}`).classList.remove('active');
        cur = i;
        document.getElementById(`item-${cur}`).classList.add('active');
        
        audio.src = tracks[i].url;
        audio.play().catch(() => {}); // Игнор ошибок автоплея
        
        document.getElementById('now-playing').innerText = tracks[i].title;
        document.getElementById('main-dl').onclick = () => window.open(tracks[i].url, '_blank');
        pIcon.setAttribute('d', ICONS.pause);
    }

    function toggle() {
        if (cur === -1) return playT(0);
        if (audio.paused) { audio.play(); pIcon.setAttribute('d', ICONS.pause); }
        else { audio.pause(); pIcon.setAttribute('d', ICONS.play); }
    }

    function skip(sec) { audio.currentTime += sec; }
    function next() { playT((cur + 1) % tracks.length); }
    function prev() { playT((cur - 1 + tracks.length) % tracks.length); }

    const formatTime = (s) => {
        if (isNaN(s)) return "0:00";
        const min = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    };

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('progress-bar').style.width = p + '%';
        document.getElementById('cur-time').innerText = formatTime(audio.currentTime);
        document.getElementById('dur-time').innerText = formatTime(audio.duration);
    };

    // Перемотка кликом по полоске
    document.getElementById('p-bg').onclick = (e) => {
        const rect = document.getElementById('p-bg').getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    init();
</script>
</body>
</html>
