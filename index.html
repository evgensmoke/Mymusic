<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVGEN MUSIC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --neon: #00f2ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; padding-bottom: 200px; }
        .playlist { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .track-item { display: flex; align-items: center; background: var(--card); border-radius: 12px; padding: 10px; cursor: pointer; border: 1px solid transparent; }
        .track-item.active { border-color: var(--neon); }
        .track-img { width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; }
        .track-info { flex-grow: 1; }
        .like-box { text-align: center; cursor: pointer; padding: 5px; }
        .like-btn { font-size: 1.4rem; background: none; border: none; color: #333; }
        .like-btn.active { color: #f85149; }
        .like-count { font-size: 0.8rem; display: block; }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #12161c; padding: 20px; border-top: 1px solid #333; text-align: center; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--neon); border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="playlist" class="playlist">Загрузка...</div>

<div class="player-bar">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="controls">
        <button onclick="prev()">⏮</button>
        <button class="play-btn" onclick="toggle()" id="pBtn">▶</button>
        <button onclick="next()">⏭</button>
    </div>
</div>

<audio id="player"></audio>

<script>
    // ИСПОЛЬЗУЕМ ТВОЙ PUBLISHABLE KEY СО СКРИНШОТА
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co";
    const S_KEY = "sb_publishable_ccjT5pM426Fz6pXm27n7v9S8R5Y7vX8m27n7v9S8R5Y7vX8m27n7v9S8R5Y7vX"; 
    // ^ ВНИМАНИЕ: Если этот ключ не сработает, вставь сюда свой "Антон" (eyJ...) еще раз, но без пробелов!

    let spb = supabase.createClient(S_URL, S_KEY);
    let tracks = [], cur = -1;
    const audio = document.getElementById('player');

    async function init() {
        try {
            const res = await fetch(`https://api.github.com/repos/evgensmoke/Mymusic/contents/`);
            const data = await res.json();
            tracks = data.filter(f => f.name.endsWith('.mp3')).map(f => ({
                id: f.name.replace('.mp3', ''),
                title: decodeURIComponent(f.name.replace('.mp3', '')).replace(/_/g, ' '),
                url: f.download_url,
                img: f.download_url.replace('.mp3', '.jpg')
            }));
            render();
            loadLikes();
        } catch(e) { console.error("GitHub Error"); }
    }

    function render() {
        document.getElementById('playlist').innerHTML = tracks.map((t, i) => `
            <div class="track-item" id="item-${i}" onclick="playT(${i})">
                <img src="${t.img}" onerror="this.src='https://raw.githubusercontent.com/evgensmoke/Mymusic/main/default.jpg'" class="track-img">
                <div class="track-info"><b>${t.title}</b></div>
                <div class="like-box" onclick="event.stopPropagation(); vote('${t.id}', ${i})">
                    <span class="like-btn" id="l-${i}">❤️</span>
                    <span class="like-count" id="c-${i}">0</span>
                </div>
            </div>`).join('');
    }

    async function loadLikes() {
        const { data, error } = await spb.from('likes').select('*');
        if (error) {
            console.log("Ошибка загрузки:", error.message);
        } else if (data) {
            data.forEach(row => {
                const idx = tracks.findIndex(t => t.id === row.song_id);
                if (idx !== -1) document.getElementById(`c-${idx}`).innerText = row.count;
            });
        }
    }

    async function vote(songId, idx) {
        const el = document.getElementById(`c-${idx}`);
        const btn = document.getElementById(`l-${idx}`);
        let count = parseInt(el.innerText) || 0;
        
        btn.classList.toggle('active');
        const newCount = btn.classList.contains('active') ? count + 1 : Math.max(0, count - 1);
        el.innerText = newCount;

        const { error } = await spb.from('likes').upsert({ song_id: songId, count: newCount });
        if (error) console.log("Ошибка сохранения:", error.message);
    }

    function playT(i) {
        if (cur !== -1) document.getElementById(`item-${cur}`).classList.remove('active');
        cur = i;
        document.getElementById(`item-${cur}`).classList.add('active');
        audio.src = tracks[i].url;
        audio.play();
        document.getElementById('now-playing').innerText = tracks[i].title;
        document.getElementById('pBtn').innerText = "⏸";
    }

    function toggle() {
        if (audio.paused) { audio.play(); document.getElementById('pBtn').innerText = "⏸"; }
        else { audio.pause(); document.getElementById('pBtn').innerText = "▶"; }
    }

    function next() { playT((cur + 1) % tracks.length); }
    function prev() { playT((cur - 1 + tracks.length) % tracks.length); }

    init();
</script>
</body>
</html>
