<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVGEN MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --neon: #00f2ff; 
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { 
            background: #020617;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%);
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; 
            min-height: 100vh; padding-bottom: 240px; 
        }

        header { text-align: center; margin: 20px 0; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); letter-spacing: 4px; font-size: 1.6rem; }

        .playlist { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .track-item { 
            display: flex; align-items: center; background: var(--glass);
            backdrop-filter: blur(15px); border: 1px solid var(--border);
            border-radius: 18px; padding: 10px; cursor: pointer; transition: 0.2s;
        }
        .track-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.05); }
        .track-img { width: 50px; height: 50px; border-radius: 10px; margin-right: 15px; object-fit: cover; }
        .track-info { flex-grow: 1; }
        .track-name { font-size: 0.9rem; font-weight: bold; }

        .like-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: rgba(255,255,255,0.1); }
        .like-btn.active { color: #ff4d4d; }

        /* Плеер */
        .player-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 450px; background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(25px); border-radius: 35px; padding: 15px 20px;
            border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        #now-playing { font-size: 0.75rem; text-align: center; color: var(--neon); margin-bottom: 8px; font-family: 'Orbitron'; }
        
        .time-info { display: flex; justify-content: space-between; font-size: 0.7rem; color: #94a3b8; margin-bottom: 5px; }

        .progress-bg { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
        #progress-bar { height: 100%; background: var(--neon); width: 0%; border-radius: 4px; box-shadow: 0 0 10px var(--neon); }

        /* Компактное управление */
        .controls { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .c-btn { background: none; border: none; cursor: pointer; fill: #fff; opacity: 0.6; padding: 8px; transition: 0.2s; }
        .c-btn:hover { opacity: 1; fill: var(--neon); }
        .c-btn.disabled { opacity: 0.1; cursor: default; }

        .play-btn { background: var(--neon); border-radius: 50%; width: 55px; height: 55px; fill: #000 !important; opacity: 1 !important; }

        /* Модалка для текста */
        #lyrics-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 10001;
        }
        .lyrics-content { 
            background: var(--glass); padding: 30px; border-radius: 20px; 
            max-width: 80%; max-height: 70%; overflow-y: auto; 
            border: 1px solid var(--border); white-space: pre-wrap; line-height: 1.6;
        }
    </style>
</head>
<body>

<header><div class="main-title">EVGEN MUSIC</div></header>
<div id="playlist" class="playlist"></div>

<div class="player-bar">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="time-info">
        <span id="cur-time">0:00</span>
        <span id="dur-time">0:00</span>
    </div>
    <div class="progress-bg" id="p-bg"><div id="progress-bar"></div></div>
    
    <div class="controls">
        <button id="txt-btn" class="c-btn disabled" onclick="showLyrics()">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </button>

        <button class="c-btn" onclick="prev()"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        
        <button class="c-btn play-btn" onclick="toggle()">
            <svg width="28" height="28" viewBox="0 0 24 24"><path id="pIcon" d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="c-btn" onclick="next()"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>

        <a id="down-btn" class="c-btn disabled" download href="#">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </a>
    </div>
</div>

<div id="lyrics-overlay" onclick="this.style.display='none'">
    <div class="lyrics-content" id="lyrics-text" onclick="event.stopPropagation()"></div>
</div>

<audio id="player"></audio>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co";
    const S_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qeHlqaWF3ZHByZWp2bWJzdnZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDE4NjcsImV4cCI6MjA4NTY3Nzg2N30.ZnmxdnR_x0C61C7ZOSWi-Xlgg2gUGmNmz7jBHHGZ9EU";
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic';
    
    let tracks = [], cur = -1, spb = supabase.createClient(S_URL, S_KEY);
    const audio = document.getElementById('player');

    async function init() {
        const res = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/`);
        const files = await res.json();
        
        const mp3s = files.filter(f => f.name.endsWith('.mp3'));
        tracks = mp3s.map(f => {
            const name = f.name.slice(0, -4);
            const txtFile = files.find(t => t.name === name + '.txt');
            return {
                id: name,
                title: decodeURIComponent(name).replace(/_/g, ' '),
                url: f.download_url,
                img: files.find(i => i.name.startsWith(name) && /\.(jpg|png|webp)$/.test(i.name))?.download_url || 'default.jpg',
                lyrics: txtFile ? txtFile.download_url : null
            };
        });
        render();
        loadLikes();
    }

    function render() {
        document.getElementById('playlist').innerHTML = tracks.map((t, i) => `
            <div class="track-item" id="item-${i}" onclick="playT(${i})">
                <img src="${t.img}" class="track-img" onerror="this.src='default.jpg'">
                <div class="track-info"><div class="track-name">${t.title}</div></div>
                <button class="like-btn" id="l-${i}" onclick="event.stopPropagation(); vote('${t.id}', ${i})">❤️</button>
            </div>`).join('');
    }

    function playT(i) {
        if (cur !== -1) document.getElementById(`item-${cur}`).classList.remove('active');
        cur = i;
        const t = tracks[i];
        document.getElementById(`item-${cur}`).classList.add('active');
        audio.src = t.url;
        audio.play();
        
        document.getElementById('now-playing').innerText = t.title;
        document.getElementById('pIcon').setAttribute('d', "M6 19h4V5H6v14zm8-14v14h4V5h-4z");
        
        // Кнопка загрузки
        const db = document.getElementById('down-btn');
        db.href = t.url; db.classList.remove('disabled');

        // Кнопка текста
        const lb = document.getElementById('txt-btn');
        if (t.lyrics) lb.classList.remove('disabled');
        else lb.classList.add('disabled');
    }

    async function showLyrics() {
        if (cur === -1 || !tracks[cur].lyrics) return;
        const res = await fetch(tracks[cur].lyrics);
        const text = await res.text();
        document.getElementById('lyrics-text').innerText = text;
        document.getElementById('lyrics-overlay').style.display = 'flex';
    }

    function toggle() {
        if (cur === -1) return playT(0);
        if (audio.paused) { audio.play(); document.getElementById('pIcon').setAttribute('d', "M6 19h4V5H6v14zm8-14v14h4V5h-4z"); }
        else { audio.pause(); document.getElementById('pIcon').setAttribute('d', "M8 5v14l11-7z"); }
    }

    function fmt(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('progress-bar').style.width = p + '%';
        document.getElementById('cur-time').innerText = fmt(audio.currentTime);
        document.getElementById('dur-time').innerText = audio.duration ? fmt(audio.duration) : "0:00";
    };

    document.getElementById('p-bg').onclick = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    };

    function next() { playT((cur + 1) % tracks.length); }
    function prev() { playT((cur - 1 + tracks.length) % tracks.length); }

    async function loadLikes() {
        const { data } = await spb.from('likes').select('*');
        data?.forEach(r => {
            const i = tracks.findIndex(t => t.id === r.song_id);
            if (i !== -1 && r.count > 0) document.getElementById(`l-${i}`).classList.add('active');
        });
    }

    async function vote(id, i) {
        const btn = document.getElementById(`l-${i}`);
        btn.classList.toggle('active');
        await spb.from('likes').upsert({ song_id: id, count: btn.classList.contains('active') ? 1 : 0 });
    }

    init();
</script>
</body>
</html>
