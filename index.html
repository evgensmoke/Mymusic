<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC FIXED</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; min-height: 100vh; padding-bottom: 240px; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.2); z-index: -1; transition: 1.5s; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; letter-spacing: 3px; font-size: 1.6rem; margin: 15px 0; text-shadow: 0 0 15px rgba(0,242,255,0.4); }
        .search-box { width: 100%; max-width: 500px; margin: 0 auto 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 25px; padding: 12px 20px; color: #fff; display: block; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto 20px; }
        .cat-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: center; font-weight: 600; color: #94a3b8; cursor: pointer; }
        .cat-card.active { border-color: var(--neon); color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .media-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
        .media-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.05); }
        .media-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 14px; background: #000; }
        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-panel { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 500px; background: rgba(13, 18, 30, 0.95); border: 1px solid var(--border); border-radius: 24px; padding: 15px 20px; z-index: 1000; backdrop-filter: blur(20px); }
        #now-playing { color: var(--neon); text-align: center; font-size: 0.85rem; margin-bottom: 12px; }
        .progress-area { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; margin-bottom: 15px; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; border-radius: 2px; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; filter: grayscale(1); }
        .play-btn { width: 55px; height: 55px; background: var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-size: 1.5rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #0a0f1c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
        .nav-item { color: #64748b; font-size: 0.75rem; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--neon); }
        #sync-btn { position: fixed; top: 10px; right: 10px; font-size: 0.6rem; opacity: 0.3; background: none; color: #fff; border: 1px solid #fff; border-radius: 5px; padding: 3px; }
    </style>
</head>
<body>
<div id="bg-layer"></div>
<button id="sync-btn" onclick="forceSync()">SYNC DB</button>
<header>
    <div class="main-title">EVGEN MUSIC</div>
    <input type="text" class="search-box" placeholder="Найти трек..." id="search-input" oninput="render()">
</header>

<div id="catalog-ui" style="display:none;">
    <div class="category-grid">
        <div class="cat-card active" id="btn-music" onclick="setCategory('music')">Музыка</div>
        <div class="cat-card" id="btn-podcasts" onclick="setCategory('podcasts')">Подкасты</div>
        <div class="cat-card" id="btn-texts" onclick="setCategory('texts')">Тексты</div>
        <div class="cat-card" id="btn-photos" onclick="setCategory('photos')">Фото</div>
    </div>
</div>

<div id="main-content" class="content-grid">Загрузка из базы данных...</div>

<div class="player-panel">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-area" onclick="seek(event)"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <button class="ctrl-btn" onclick="openLyrics()">📝</button>
        <button class="ctrl-btn" onclick="audio.currentTime-=10">⏪</button>
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <div class="play-btn" onclick="toggle()" id="p-trigger">▶</div>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        <button class="ctrl-btn" onclick="audio.currentTime+=10">⏩</button>
        <button class="ctrl-btn" onclick="downloadTrack()">💾</button>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" id="tab-home" onclick="setTab('home')">🏠<br>Главная</div>
    <div class="nav-item" id="tab-catalog" onclick="setTab('catalog')">📁<br>Каталог</div>
    <div class="nav-item" id="tab-my" onclick="setTab('my')">⭐<br>Моё</div>
</nav>

<audio id="audio-engine" crossorigin="anonymous"></audio>
<div id="text-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; padding:20px; overflow-y:auto;" onclick="this.style.display='none'"><div id="text-content" style="white-space:pre-wrap;"></div></div>
<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co", S_KEY = "sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks";
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic', DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;
    
    let songs = [];
    let currentTab = 'home', currentCategory = 'music', curId = null;
    const audio = document.getElementById('audio-engine'), sb = supabase.createClient(S_URL, S_KEY);

    async function init() {
        // ЗАГРУЖАЕМ ВСЁ ТОЛЬКО ИЗ SUPABASE
        const { data, error } = await sb.from('likes').select('*');
        if (error) { 
            document.getElementById('main-content').innerText = "База данных недоступна. Нажми SYNC DB в углу."; 
            return;
        }
        
        songs = data.map(r => ({
            id: r.song_id,
            title: r.song_id, // Используем ID как имя, если нет другого
            url: `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/music/${encodeURIComponent(r.song_id)}.mp3`,
            img: r.cover_data || DEF_IMG,
            likes: r.count || 0,
            duration: r.duration || '--:--'
        }));
        
        render();
    }

    function render() {
        const container = document.getElementById('main-content'), query = document.getElementById('search-input').value.toLowerCase();
        document.getElementById('catalog-ui').style.display = (currentTab === 'catalog') ? 'block' : 'none';
        container.innerHTML = '';

        let list = songs;
        if (currentTab === 'home') list = songs.filter(s => s.likes > 0);
        if (currentTab === 'my') list = songs.filter(s => localStorage.getItem('fav_'+s.id));

        list.filter(s => s.id.toLowerCase().includes(query)).forEach(s => {
            const el = document.createElement('div');
            el.className = `media-item ${curId === s.id ? 'active' : ''}`;
            el.onclick = () => play(s);
            el.innerHTML = `
                <img src="${s.img}" class="media-img">
                <div class="media-info">
                    <div class="media-name">${s.id}</div>
                    <div class="media-meta">${s.duration} • ${s.likes} ❤️</div>
                </div>
                <div style="font-size:1.2rem" onclick="event.stopPropagation(); toggleLike('${s.id}')">${s.likes > 0 ? '❤️' : '🤍'}</div>
            `;
            container.appendChild(el);
        });
    }

    async function play(s) {
        if(curId !== s.id) {
            curId = s.id; audio.src = s.url; audio.play();
            document.getElementById('now-playing').innerText = s.id;
            document.getElementById('bg-layer').style.backgroundImage = `url(${s.img})`;
            document.getElementById('p-trigger').innerText = '⏸';
            
            // Если нет обложки - пытаемся вытащить один раз
            if (s.img === DEF_IMG) tryExtract(s);
        } else toggle();
        render();
    }

    function toggle() { 
        if(audio.paused) { audio.play(); document.getElementById('p-trigger').innerText = '⏸'; }
        else { audio.pause(); document.getElementById('p-trigger').innerText = '▶'; }
    }

    async function toggleLike(id) {
        const s = songs.find(x => x.id === id);
        s.likes = s.likes > 0 ? 0 : 1;
        await sb.from('likes').upsert({ song_id: id, count: s.likes }, { onConflict: 'song_id' });
        render();
    }

    // ТА САМАЯ КНОПКА ОБНОВЛЕНИЯ (SYNC)
    async function forceSync() {
        const btn = document.getElementById('sync-btn');
        btn.innerText = "SYNCING...";
        try {
            const r = await fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/music`);
            const files = await r.json();
            for (let f of files) {
                if(f.name.endsWith('.mp3')) {
                    const id = f.name.replace('.mp3', '');
                    await sb.from('likes').upsert({ song_id: id }, { onConflict: 'song_id' });
                }
            }
            alert("База обновлена! Перезагружаю...");
            location.reload();
        } catch(e) { alert("GitHub всё еще блокирует API. Подожди 10 мин."); }
        btn.innerText = "SYNC DB";
    }

    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }
    audio.ontimeupdate = () => { document.getElementById('progress-fill').style.width = (audio.currentTime/audio.duration*100) + '%'; };
    
    function setTab(t) { currentTab = t; render(); document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.id === 'tab-'+t)); }
    function setCategory(c) { currentCategory = c; render(); }
    
    init();
</script>
</body>
</html>
