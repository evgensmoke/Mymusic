<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; min-height: 100vh; padding-bottom: 240px; overflow-x: hidden; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.2); z-index: -1; transition: 1.5s; }
        header { margin-bottom: 20px; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; letter-spacing: 3px; font-size: 1.6rem; margin-bottom: 15px; }
        .search-box { width: 100%; max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 25px; padding: 12px 20px; color: #fff; display: block; font-size: 16px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto 20px; }
        .cat-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: center; font-weight: 600; color: #94a3b8; cursor: pointer; }
        .cat-card.active { border-color: var(--neon); color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .media-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
        .media-item.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.05); }
        .media-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 14px; background: #000; flex-shrink: 0; }
        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-meta { font-size: 0.75rem; color: #94a3b8; }
        .player-panel { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 500px; background: rgba(13, 18, 30, 0.98); border: 1px solid var(--border); border-radius: 24px; padding: 15px 20px; z-index: 1000; backdrop-filter: blur(20px); }
        #now-playing { color: var(--neon); text-align: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .progress-area { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; margin-bottom: 15px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; transition: width 0.1s linear; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: none; border: none; fill: #94a3b8; cursor: pointer; padding: 8px; }
        .play-btn { width: 55px; height: 55px; background: var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; fill: #000; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #0a0f1c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
        .nav-item { color: #64748b; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .nav-item.active { color: var(--neon); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>
<div id="bg-layer"></div>
<header>
    <div class="main-title">EVGEN MUSIC</div>
    <input type="text" class="search-box" id="search-input" placeholder="Поиск трека..." oninput="render()">
</header>
<div id="catalog-ui" style="display:none;">
    <div class="category-grid">
        <div class="cat-card active" id="btn-music" onclick="setCategory('music')">Музыка</div>
        <div class="cat-card" id="btn-podcasts" onclick="setCategory('podcasts')">Подкасты</div>
    </div>
</div>
<div id="main-content" class="content-grid">Загрузка...</div>
<div class="player-panel">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-area" id="p-bg"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <button class="ctrl-btn" onclick="prevTrack()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="ctrl-btn" onclick="audio.currentTime-=10"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
        <div class="play-btn" onclick="toggle()"><svg id="p-icon" width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <button class="ctrl-btn" onclick="audio.currentTime+=10"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
        <button class="ctrl-btn" onclick="nextTrack()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
</div>
<nav class="bottom-nav">
    <div class="nav-item active" id="tab-home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Популярное</span></div>
    <div class="nav-item" id="tab-catalog" onclick="setTab('catalog')"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg><span>Каталог</span></div>
    <div class="nav-item" id="tab-my" onclick="setTab('my')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Моё</span></div>
</nav>
<audio id="audio-engine" crossorigin="anonymous"></audio>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co", S_KEY = "sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks";
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic', DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;
    
    let media = { music: [], podcasts: [] }, currentTab = 'home', currentCategory = 'music', curId = null;
    const audio = document.getElementById('audio-engine'), sb = supabase.createClient(S_URL, S_KEY);

    async function init() {
        try {
            const [m, p] = await Promise.all([fGH('music'), fGH('podcasts')]);
            media.music = mapF(m); media.podcasts = mapF(p);
            await syncDB();
            render();
        } catch(e) { document.getElementById('main-content').innerText = "Ошибка сети. Проверь VPN."; }
    }

    const mapF = (files) => (files || []).filter(f => f.name.endsWith('.mp3')).map(f => ({
        id: f.name.replace('.mp3',''), title: decodeURIComponent(f.name.replace('.mp3','')),
        url: f.download_url, img: DEF_IMG, likes: 0, duration: '--:--', artist: ''
    }));

    async function fGH(path) { 
        return fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/${path}`)}`)
            .then(r => r.json()).then(d => JSON.parse(d.contents)).catch(() => []); 
    }

    async function syncDB() {
        const { data } = await sb.from('likes').select('*');
        if (data) data.forEach(r => {
            const t = [...media.music, ...media.podcasts].find(x => x.id === r.song_id);
            if (t) { t.likes = r.count || 0; t.duration = r.duration || '--:--'; if(r.cover_data) t.img = r.cover_data; t.artist = r.artist || ''; }
        });
    }

    function render() {
        const container = document.getElementById('main-content'), s = document.getElementById('search-input').value.toLowerCase();
        document.getElementById('catalog-ui').style.display = (currentTab === 'catalog') ? 'block' : 'none';
        container.innerHTML = '';
        let list = (currentTab === 'home') ? media.music.filter(x => x.likes > 0) : (currentTab === 'my' ? media.music.filter(x => localStorage.getItem('fav_'+x.id)) : media[currentCategory]);
        
        list.filter(x => (x.title || "").toLowerCase().includes(s)).forEach(t => {
            const el = document.createElement('div');
            el.className = `media-item ${curId === t.id ? 'active' : ''}`;
            el.onclick = () => play(t);
            el.innerHTML = `<img src="${t.img}" class="media-img"><div class="media-info"><div class="media-name">${t.title}</div><div class="media-meta">${t.artist || 'Evgen'} • ${t.duration}</div></div><div onclick="event.stopPropagation(); toggleFav('${t.id}')" style="font-size:1.2rem">${localStorage.getItem('fav_'+t.id)?'⭐':'➕'}</div>`;
            container.appendChild(el);
        });
    }

    function play(t) {
        if(curId !== t.id) {
            curId = t.id; audio.src = t.url; audio.play();
            document.getElementById('now-playing').innerText = t.title;
            document.getElementById('bg-layer').style.backgroundImage = `url(${t.img})`;
            audio.onloadedmetadata = () => { if(t.duration === '--:--') { t.duration = fT(audio.duration); upd(t); render(); } };
        } else toggle();
        render();
    }

    function toggle() { audio.paused ? audio.play() : audio.pause(); updB(); }
    function updB() { document.getElementById('p-icon').innerHTML = audio.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
    function fT(s) { let m=Math.floor(s/60), sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
    function setTab(t) { currentTab=t; render(); }
    function setCategory(c) { currentCategory=c; render(); }
    function toggleFav(id) { localStorage.getItem('fav_'+id)?localStorage.removeItem('fav_'+id):localStorage.setItem('fav_'+id,'1'); render(); }
    async function upd(t) { await sb.from('likes').upsert({ song_id: t.id, count: t.likes, duration: t.duration }, { onConflict: 'song_id' }); }
    
    document.getElementById('p-bg').onclick = (e) => { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; };
    audio.ontimeupdate = () => { document.getElementById('progress-fill').style.width = (audio.currentTime/audio.duration*100) + '%'; };
    
    init();
</script>
</body>
</html>
