<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --neon: #00f2ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; padding-bottom: 240px; }
        header { text-align: center; padding: 20px 0; }
        .main-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; }
        .playlist { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .track-item { display: flex; align-items: center; background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .track-item.active { border-color: var(--neon); box-shadow: 0 0 10px rgba(0,242,255,0.2); }
        .track-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-right: 15px; background: #222; }
        .track-info { flex-grow: 1; overflow: hidden; }
        .track-name { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .like-box { text-align: center; min-width: 50px; }
        .like-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #30363d; transition: 0.3s; padding: 0; }
        .like-btn.active { color: #f85149; transform: scale(1.1); }
        .like-count { font-size: 0.75rem; color: #8b949e; display: block; }
        
        /* Плеер */
        .player-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(22, 27, 34, 0.98); backdrop-filter: blur(15px); border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); z-index: 9999; }
        #now-playing { font-size: 0.85rem; text-align: center; margin-bottom: 12px; color: var(--neon); font-family: 'Orbitron', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .time-info { display: flex; justify-content: space-between; font-size: 0.7rem; color: #8b949e; margin-top: 5px; }
        .progress-bg { width: 100%; height: 6px; background: #30363d; border-radius: 3px; cursor: pointer; position: relative; }
        #progress-bar { width: 0%; height: 100%; background: var(--neon); border-radius: 3px; box-shadow: 0 0 10px var(--neon); }
        .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
        .c-btn { background: none; border: none; cursor: pointer; fill: #fff; transition: 0.2s; padding: 5px; }
        .c-btn:hover { transform: scale(1.1); fill: var(--neon); }
        .play-btn { background: var(--neon); border-radius: 50%; width: 50px; height: 50px; fill: #000 !important; display: flex; align-items: center; justify-content: center; }
        .dl-btn { fill: #8b949e; }
    </style>
</head>
<body>

<header><div class="main-title">My Music Collection</div></header>
<div id="playlist" class="playlist">Инициализация систем...</div>

<div class="player-bar">
    <div id="now-playing">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-bg" id="p-bg"><div id="progress-bar"></div></div>
    <div class="time-info">
        <span id="cur-time">0:00</span>
        <span id="dur-time">0:00</span>
    </div>
    <div class="controls">
        <button class="c-btn dl-btn" id="main-dl" title="Скачать"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM12 2L7 7h3v6h4V7h3l-5-5z"/></svg></button>
        <button class="c-btn" onclick="skip(-10)"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
        <button class="c-btn" onclick="prev()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
        
        <button class="c-btn play-btn" onclick="toggle()">
            <svg width="28" height="28" viewBox="0 0 24 24">
                <path id="pIcon" d="M8 5v14l11-7z"/>
            </svg>
        </button>

        <button class="c-btn" onclick="next()"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button class="c-btn" onclick="skip(10)"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
    </div>
</div>

<audio id="player"></audio>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co";
    const S_KEY = "Sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks"; 
    const G_CFG = { u: 'evgensmoke', r: 'Mymusic', def: 'https://raw.githubusercontent.com/evgensmoke/Mymusic/main/default.jpg' };

    let tracks = [], cur = -1, spb;
    const audio = document.getElementById('player');
    const pIcon = document.getElementById('pIcon');

    // Иконки
    const ICONS = {
        play: "M8 5v14l11-7z",
        pause: "M6 19h4V5H6v14zm8-14v14h4V5h-4z"
    };

    async function init() {
        if (window.supabase) spb = window.supabase.createClient(S_URL, S_KEY);

        try {
            const res = await fetch(`https://api.github.com/repos/${G_CFG.u}/${G_CFG.r}/contents/`);
            const data = await res.json();
            
            tracks = data
                .filter(f => f.name.toLowerCase().endsWith('.mp3'))
                .map(f => ({
                    id: f.name.replace(/\.[^/.]+$/, ""),
                    url: `https://raw.githubusercontent.com/${G_CFG.u}/${G_CFG.r}/main/${encodeURIComponent(f.name)}`,
                    img: G_CFG.def,
                    title: f.name.replace(/\.[^/.]+$/, "")
                }));
            
            render();
            if (spb) loadLikes();
            tracks.forEach((t, i) => loadTags(t, i));
            
        } catch(e) { document.getElementById('playlist').innerHTML = "Ошибка: " + e.message; }
    }

    function render() {
        document.getElementById('playlist').innerHTML = tracks.map((t, i) => `
            <div class="track-item" id="item-${i}" onclick="playT(${i})">
                <img src="${t.img}" class="track-img" id="img-${i}">
                <div class="track-info">
                    <div class="track-name" id="title-${i}">${t.title}</div>
                </div>
                <div class="like-box">
                    <button class="like-btn" id="l-${i}" onclick="event.stopPropagation(); vote('${t.id}', ${i})">❤️</button>
                    <span class="like-count" id="c-${i}">0</span>
                </div>
            </div>
        `).join('');
    }

    function loadTags(track, i) {
        if (!window.jsmediatags) return;
        jsmediatags.read(track.url, {
            onSuccess: (tag) => {
                if (tag.tags.picture) {
                    const { data, format } = tag.tags.picture;
                    const base64 = btoa(data.map(b => String.fromCharCode(b)).join(""));
                    document.getElementById(`img-${i}`).src = `data:${format};base64,${base64}`;
                }
                if (tag.tags.title) {
                    document.getElementById(`title-${i}`).innerText = tag.tags.title;
                    tracks[i].title = tag.tags.title;
                }
            }
        });
    }

    async function loadLikes() {
        const { data } = await spb.from('likes').select('*');
        if (data) {
            data.forEach(row => {
                const idx = tracks.findIndex(t => t.id === row.song_id);
                if (idx !== -1) document.getElementById(`c-${idx}`).innerText = row.count;
            });
        }
    }

    async function vote(songId, idx) {
        const countEl = document.getElementById(`c-${idx}`);
        const btn = document.getElementById(`l-${idx}`);
        let count = parseInt(countEl.innerText);

        btn.classList.toggle('active');
        const isAdding = btn.classList.contains('active');
        const newCount = isAdding ? count + 1 : Math.max(0, count - 1);
        countEl.innerText = newCount;

        if (spb) {
            const { error } = await spb.from('likes').upsert({ song_id: songId, count: newCount }, { onConflict: 'song_id' });
            if (error) console.error("DB Error:", error.message);
        }
    }

    function playT(i) {
        if (cur !== -1) document.getElementById(`item-${cur}`).classList.remove('active');
        cur = i;
        document.getElementById(`item-${cur}`).classList.add('active');
        
        audio.src = tracks[i].url;
        audio.play();
        
        document.getElementById('now-playing').innerText = tracks[i].title;
        document.getElementById('main-dl').onclick = () => window.open(tracks[i].url, '_blank');
        pIcon.setAttribute('d', ICONS.pause);
    }

    function toggle() {
        if (cur === -1) return playT(0);
        if (audio.paused) { audio.play(); pIcon.setAttribute('d', ICONS.pause); }
        else { audio.pause(); pIcon.setAttribute('d', ICONS.play); }
    }

    function skip(sec) { audio.currentTime += sec; }
    function next() { playT((cur + 1) % tracks.length); }
    function prev() { playT((cur - 1 + tracks.length) % tracks.length); }

    // Прогресс и время
    const formatTime = (s) => {
        const min = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    };

    audio.ontimeupdate = () => {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progress-bar').style.width = p + '%';
        document.getElementById('cur-time').innerText = formatTime(audio.currentTime);
        if (!isNaN(audio.duration)) document.getElementById('dur-time').innerText = formatTime(audio.duration);
    };

    document.getElementById('p-bg').onclick = (e) => {
        const rect = document.getElementById('p-bg').getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    init();
</script>
</body>
</html>
