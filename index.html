<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVGEN MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); --fav: #fbbf24; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; min-height: 100vh; padding-bottom: 240px; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(60px) brightness(0.15); z-index: -1; transition: 1.5s; }
        .main-title { font-family: 'Orbitron', sans-serif; color: var(--neon); text-align: center; font-size: 1.5rem; margin-bottom: 15px; }
        .search-box { width: 100%; max-width: 500px; margin: 0 auto 20px; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 12px 20px; color: #fff; display: block; }
        
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: 0 auto 20px; }
        .cat-card { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; color: #94a3b8; }
        .cat-card.active { border-color: var(--neon); color: var(--neon); background: rgba(0, 242, 255, 0.1); }

        .content-grid { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .media-item { display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; }
        .media-item.active { border-color: var(--neon); }
        .media-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 12px; background: #000; }
        .media-info { flex-grow: 1; overflow: hidden; }
        .media-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-meta { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }

        .player-panel { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(13, 18, 30, 0.98); border: 1px solid var(--border); border-radius: 24px; padding: 15px; z-index: 1000; backdrop-filter: blur(20px); }
        #now-playing { color: var(--neon); text-align: center; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        
        .progress-area { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 15px; cursor: pointer; }
        #progress-fill { height: 100%; background: var(--neon); width: 0%; border-radius: 3px; box-shadow: 0 0 10px var(--neon); }
        
        .controls-row { display: flex; justify-content: space-around; align-items: center; }
        .play-btn { width: 55px; height: 55px; background: var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; fill: #000; }
        .ctrl-icon { fill: #fff; width: 24px; height: 24px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #0a0f1c; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1001; }
        .nav-item { color: #64748b; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item.active { color: var(--neon); }

        #text-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; padding: 20px; flex-direction: column; align-items: center; justify-content: center; }
        #text-content { background: #1e293b; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; max-height: 70vh; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<div id="bg-layer"></div>
<div class="main-title">EVGEN MUSIC</div>
<input type="text" class="search-box" placeholder="Поиск..." id="search-input" oninput="render()">

<div id="cat-container" class="category-grid">
    <div class="cat-card active" id="btn-music" onclick="setCategory('music')">Музыка</div>
    <div class="cat-card" id="btn-podcasts" onclick="setCategory('podcasts')">Подкасты</div>
    <div class="cat-card" id="btn-photos" onclick="setCategory('photos')">Фото</div>
    <div class="cat-card" id="btn-texts" onclick="setCategory('texts')">Тексты</div>
</div>

<div id="main-content" class="content-grid">Загрузка...</div>

<div class="player-panel">
    <div id="now-playing" onclick="openLyrics()">ВЫБЕРИТЕ ТРЕК</div>
    <div class="progress-area" onclick="seek(event)"><div id="progress-fill"></div></div>
    <div class="controls-row">
        <div onclick="shareTrack()"><svg class="ctrl-icon" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></div>
        <div onclick="prevTrack()"><svg class="ctrl-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></div>
        <div class="play-btn" onclick="toggle()"><svg id="p-icon" width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div onclick="nextTrack()"><svg class="ctrl-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></div>
        <div onclick="downloadTrack()"><svg class="ctrl-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="setTab('home')">🏠<span>Главная</span></div>
    <div class="nav-item" onclick="setTab('catalog')">📂<span>Каталог</span></div>
    <div class="nav-item" onclick="setTab('my')">⭐<span>Моё</span></div>
</nav>

<div id="text-modal" onclick="this.style.display='none'">
    <div id="text-content" onclick="event.stopPropagation()"></div>
</div>

<script>
    const S_URL = "https://ojxyjiawdprejvmbsvvj.supabase.co", S_KEY = "sb_publishable_CCjT5fIUcKY-jzlZyzKwLQ_eLfaT1ks";
    const G_USER = 'evgensmoke', G_REPO = 'Mymusic', DEF_IMG = `https://raw.githubusercontent.com/${G_USER}/${G_REPO}/main/default.jpg`;
    
    let media = { music: [], podcasts: [], photos: [], texts: [] };
    let curTab = 'home', curCat = 'music', curId = null;
    const audio = new Audio();
    const supabaseClient = supabase.createClient(S_URL, S_KEY);

    async function init() {
        const [m, p, i, t] = await Promise.all([fetchGH('music'), fetchGH('podcasts'), fetchGH('photos'), fetchGH('texts')]);
        media.music = m.filter(f => f.name.endsWith('.mp3')).map(f => ({ id: f.name.replace('.mp3',''), title: decodeURIComponent(f.name.replace('.mp3','')), url: f.download_url, img: DEF_IMG, likes: 0 }));
        media.podcasts = p.filter(f => f.name.endsWith('.mp3')).map(f => ({ id: f.name.replace('.mp3',''), title: decodeURIComponent(f.name.replace('.mp3','')), url: f.download_url, img: DEF_IMG, likes: 0 }));
        media.photos = i.filter(f => /\.(jpg|png)$/i.test(f.name));
        media.texts = t.filter(f => f.name.endsWith('.txt'));

        await syncDB();
        render();
        // В фоне сканим теги только для новых
        media.music.concat(media.podcasts).forEach(track => { if(track.img === DEF_IMG) scanTags(track); });
    }

    async function fetchGH(path) { return fetch(`https://api.github.com/repos/${G_USER}/${G_REPO}/contents/${path}`).then(r => r.json()).catch(() => []); }

    async function syncDB() {
        const { data } = await supabaseClient.from('likes').select('*');
        if (data) data.forEach(r => {
            const track = [...media.music, ...media.podcasts].find(x => x.id === r.song_id);
            if (track) {
                track.likes = r.count || 0;
                if (r.cover_data) track.img = r.cover_data;
                if (r.artist) track.artist = r.artist;
                track.lyrics = r.lyrics;
            }
        });
    }

    function scanTags(t) {
        jsmediatags.read(t.url, {
            onSuccess: (tag) => {
                let update = { song_id: t.id };
                if (tag.tags.picture) {
                    const { data, format } = tag.tags.picture;
                    let base64 = btoa(String.fromCharCode(...data));
                    t.img = `data:${format};base64,${base64}`;
                    update.cover_data = t.img;
                }
                if (tag.tags.artist) { t.artist = tag.tags.artist; update.artist = t.artist; }
                if (tag.tags.lyrics) { t.lyrics = tag.tags.lyrics.lyrics; update.lyrics = t.lyrics; }
                supabaseClient.from('likes').upsert(update, { onConflict: 'song_id' }).then(() => render());
            }
        });
    }

    function render() {
        const container = document.getElementById('main-content');
        const search = document.getElementById('search-input').value.toLowerCase();
        document.getElementById('cat-container').style.display = (curTab === 'catalog') ? 'grid' : 'none';
        container.innerHTML = '';

        let list = (curTab === 'home') ? media.music : (curTab === 'my' ? media.music.filter(x => localStorage.getItem('fav_'+x.id)) : media[curCat]);
        
        list.filter(x => x.title?.toLowerCase().includes(search)).forEach(item => {
            const el = document.createElement('div');
            el.className = `media-item ${curId === item.id ? 'active' : ''}`;
            el.onclick = () => play(item);
            el.innerHTML = `
                <img src="${item.img || DEF_IMG}" class="media-img">
                <div class="media-info">
                    <div class="media-name">${item.title}</div>
                    <div class="media-meta">${item.artist || 'Евгений'} • ${item.likes} ❤️</div>
                </div>
                <div onclick="event.stopPropagation(); doLike('${item.id}')">${item.likes ? '❤️' : '🤍'}</div>
            `;
            container.appendChild(el);
        });
    }

    function play(t) {
        if (curId !== t.id) {
            curId = t.id; audio.src = t.url; audio.play();
            document.getElementById('now-playing').innerText = t.title;
            document.getElementById('bg-layer').style.backgroundImage = `url(${t.img})`;
        } else toggle();
        render();
    }

    function toggle() { audio.paused ? audio.play() : audio.pause(); updateBtn(); }
    function updateBtn() { document.getElementById('p-icon').innerHTML = audio.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; }
    function seek(e) { audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }
    audio.ontimeupdate = () => { document.getElementById('progress-fill').style.width = (audio.currentTime/audio.duration*100) + '%'; };

    async function doLike(id) {
        const t = media.music.find(x => x.id === id);
        t.likes = t.likes ? 0 : 1;
        await supabaseClient.from('likes').upsert({ song_id: id, count: t.likes }, { onConflict: 'song_id' });
        render();
    }

    async function openLyrics() {
        const t = [...media.music, ...media.podcasts].find(x => x.id === curId);
        if (!t) return;
        let text = t.lyrics || "Текст не найден в тегах.";
        document.getElementById('text-content').innerText = text;
        document.getElementById('text-modal').style.display = 'flex';
    }

    function downloadTrack() {
        const t = [...media.music, ...media.podcasts].find(x => x.id === curId);
        if(!t) return;
        const a = document.createElement('a'); a.href = t.url; a.download = t.title + ".mp3"; a.click();
    }

    function shareTrack() {
        const t = [...media.music, ...media.podcasts].find(x => x.id === curId);
        if(t && navigator.share) navigator.share({ title: t.title, url: window.location.href });
    }

    function setTab(t) { curTab = t; render(); }
    function setCategory(c) { curCat = c; render(); }

    init();
</script>
</body>
</html>
